# ══════════════════════════════════════════════════════════════
# SchoolOS — حزمةُ جلسةٍ واحدة: خادمٌ حيٌّ لشجرةِ عملٍ على منفذها هي.
#
# لِمَ هذا الملفّ؟ كانت قاعدةُ المشروع «عدّل في `D:\shschool_mvp` وحدَه»، لا
# حبّاً في المسار بل لأنّ `docker-compose.yml` يربط `- .:/app` — فما كُتب في
# شجرةِ عملٍ لم يكن يُرى على الشاشة. والقاعدةُ عالجت العَرَض بمنع العزل الذي
# يمنحه غيت مجّاناً: رأسٌ واحدٌ وفهرسٌ واحدٌ لجلساتٍ متوازية، فتبديلُ فرعٍ في
# إحداها يسحب الأرضَ من تحت الأخرى.
#
# فهنا خادمٌ لكلّ شجرة: يُشغَّل **من داخل الشجرة** فيربطها هي (`- .:/app`
# يُحلّ على دليل المشروع، و`--project-directory .` يجعله شجرتَك)، ويستعمل
# قاعدةَ البيانات وredis المشتركَين عبر منفذَيهما المنشورَين على المضيف — فلا
# نسخةَ ثانيةً من البيانات ولا بذرةَ جديدة.
#
# ## الاستعمال — من داخل شجرة العمل
#
#     cp D:/shschool_mvp/.env .env        # مرّةً واحدةً لكلّ شجرة (وهو مُتجاهَلٌ في غيت)
#     WEB_PORT=8001 docker compose -p schoolos-<الشجرة> --project-directory . \
#         -f D:/shschool_mvp/docker-compose.session.yml up -d
#     → http://localhost:8001
#
# و`--project-directory .` هو المفتاح: المساراتُ النسبيّةُ في هذا الملفّ تُحلّ
# على دليل المشروع لا على موضع الملفّ. فيبقى الملفُّ في الجذر واحداً — تراه
# كلُّ الشجرات من فرعٍ واحدٍ متى دُمج — ويُربط مع ذلك ما في شجرتك أنت. ونسخُه
# إلى كلّ شجرةٍ كان سيُخلّف ملفّاً غيرَ متتبَّعٍ يمنع سحبَ الفرع لاحقاً.
#
# ولكلّ جلسةٍ منفذُها: 8001، 8002، 8003… ولا تتصادم لأنّ اسمَ المشروع
# (`-p`) يفرّق الحاويات، والمنفذُ يفرّق المضيف.
#
# ## شرطان
#
#   ١. الحزمةُ الأصليّة (`docker-compose.yml`) تعمل — منها قاعدةُ البيانات
#      وredis والصورةُ المبنيّة. هذا الملفّ لا يبني شيئاً: الصورةُ تحمل
#      الاعتماديّات، والكودُ مربوطٌ حيّاً، فالبدءُ لحظيّ.
#   ٢. لكلّ شجرةٍ قاعدتُها (`SESSION_DB`، انظر scripts/session-db.sh) وفضاؤها في
#      redis المشترك: طابورٌ وبادئةُ قنواتٍ باسم القاعدة، وعاملٌ يخدمه (`worker`).
# ══════════════════════════════════════════════════════════════
services:
  web:
    # لا `build`: الصورةُ من الحزمة الأصليّة — شغّلها مرّةً قبل هذه.
    image: ${SCHOOLOS_IMAGE:-shschool_mvp-web}
    restart: unless-stopped
    # runserver وحدَه بدور التطبيق غير-superuser (shschool_app) ليخضع لـRLS.
    # والهجرةُ تُطبَّق هنا الآن: لكلّ شجرةٍ قاعدتُها (انظر SESSION_DB أدناه).
    #
    # وينتظر القاعدةَ قبل أن يبدأ: بعد إعادة تشغيل Docker تقلع الحاوياتُ معاً،
    # فيسبق الخادمُ القاعدةَ («the database system is starting up»)، ويسقط فحصُ
    # runserver الأوّل فيبقى المُعيدُ التلقائيُّ ينتظر تعديلَ ملفٍّ لا يأتي —
    # فتبقى الشجرةُ معطّلةً حتى يُعاد تشغيلُها يدويّاً (وقع مرّتين 2026-09-22).
    command:
      - sh
      - -c
      - |
        export DB_USER=shschool_app DB_PASSWORD=$$APP_DB_PASSWORD
        until python -c "import os, psycopg2; psycopg2.connect(host=os.environ['DB_HOST'], port=os.environ['DB_PORT'], dbname=os.environ['DB_NAME'], user=os.environ['DB_USER'], password=os.environ['DB_PASSWORD'], connect_timeout=3).close()" 2>/dev/null; do
          echo "بانتظار قاعدة البيانات على $$DB_HOST:$$DB_PORT…"; sleep 2
        done
        exec python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_SETTINGS_MODULE: shschool.settings.development
      # قاعدةُ البيانات وredis في حزمةٍ أخرى، فيُوصَل إليهما عبر منفذَي
      # المضيف المنشورَين لا عبر شبكةِ الإنشاء.
      DB_HOST: host.docker.internal
      DB_PORT: ${DB_HOST_PORT:-5433}
      # قاعدةٌ لكلّ شجرة: أنشئها مرّةً بـ`bash scripts/session-db.sh`، ومرّرِ
      # اسمَها هنا. وبلا SESSION_DB تعود المشاركةُ القديمةُ وما فيها من خطر:
      # هجرةُ فرعٍ تُسقط صفحاتِ كلّ الأشجار.
      DB_NAME: ${SESSION_DB:-shschool_db}
      REDIS_URL: redis://host.docker.internal:${REDIS_HOST_PORT:-6380}/0
      # فضاءُ الجلسة في redis المشترك: طابورُ Celery وبادئةُ القنوات باسم قاعدتها
      # (shschool/settings/development.py). فلا يلتقط عاملُ غيرِها مهامَّها.
      SESSION_NAMESPACE: ${SESSION_DB:-}
      PYTHONUNBUFFERED: "1"
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    env_file:
      - .env
    volumes:
      - .:/app                # شجرةُ العمل هذه — انظر `--project-directory` أعلاه
      - /app/.venv            # لا تُظلِّل بيئة الصورة بأي venv محلي
    ports:
      - "${WEB_PORT:-8001}:8000"
    # على Docker Desktop يُحلّ الاسمُ تلقائيّاً، وهذا السطرُ لأجل لينكس.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # عاملُ المهامّ الخلفيّة لهذه الشجرة — يقلع مع الخادم دائماً.
  # كان اختياريّاً خلف profile، فتُرسَل مهامُّ الشجرة إلى الطابور المشترك ويلتقطها
  # عاملُ الحزمة الأصليّة على قاعدته هو («الصفّ غير موجود»). والآن للجلسة طابورُها
  # (`SESSION_NAMESPACE`)، فلا يخدمها إلّا عاملُها — ولا يُعيد تحميلَ الكود من نفسه:
  # بعد تعديل مهمّةٍ أعِد تشغيلَه (`… restart worker`).
  worker:
    image: ${SCHOOLOS_IMAGE:-shschool_mvp-web}
    restart: unless-stopped
    # ينتظر القاعدةَ كالخادم أعلاه.
    command:
      - sh
      - -c
      - |
        export DB_USER=shschool_app DB_PASSWORD=$$APP_DB_PASSWORD
        until python -c "import os, psycopg2; psycopg2.connect(host=os.environ['DB_HOST'], port=os.environ['DB_PORT'], dbname=os.environ['DB_NAME'], user=os.environ['DB_USER'], password=os.environ['DB_PASSWORD'], connect_timeout=3).close()" 2>/dev/null; do
          echo "بانتظار قاعدة البيانات على $$DB_HOST:$$DB_PORT…"; sleep 2
        done
        exec celery -A shschool worker -l info --concurrency=2
    # فحصُ الصحّة للعامل لا للخادم: الصورةُ ترث فحصَ `/health/` على المنفذ 8000، ولا
    # خادمَ في حاوية العامل فتظهر «unhealthy» وهي سليمة. هذا فحصُ الحزمة الأصليّة نفسُه.
    healthcheck:
      test: ["CMD-SHELL", "celery -A shschool inspect ping -d celery@$$(hostname) --timeout 10 | grep -q pong || exit 1"]
      interval: 30s
      timeout: 15s
      start_period: 40s
      retries: 3
    environment:
      DJANGO_SETTINGS_MODULE: shschool.settings.development
      DB_HOST: host.docker.internal
      DB_PORT: ${DB_HOST_PORT:-5433}
      # قاعدةٌ لكلّ شجرة: أنشئها مرّةً بـ`bash scripts/session-db.sh`، ومرّرِ
      # اسمَها هنا. وبلا SESSION_DB تعود المشاركةُ القديمةُ وما فيها من خطر:
      # هجرةُ فرعٍ تُسقط صفحاتِ كلّ الأشجار.
      DB_NAME: ${SESSION_DB:-shschool_db}
      REDIS_URL: redis://host.docker.internal:${REDIS_HOST_PORT:-6380}/0
      # فضاءُ الجلسة في redis المشترك: طابورُ Celery وبادئةُ القنوات باسم قاعدتها
      # (shschool/settings/development.py). فلا يلتقط عاملُ غيرِها مهامَّها.
      SESSION_NAMESPACE: ${SESSION_DB:-}
      PYTHONUNBUFFERED: "1"
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/.venv
    extra_hosts:
      - "host.docker.internal:host-gateway"
