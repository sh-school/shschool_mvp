name: لقطات الهويّة البصريّة — قياسٌ استشاريّ (VI-13)

# ══════════════════════════════════════════════
#  لقطاتٌ آليّةٌ لأهمّ خمس صفحاتٍ نهاراً وليلاً بعرضَي الجوال وسطح المكتب (tests/visual_snapshots.py).
#
#  **مرحلةٌ استشاريّة:** هذه الوظيفةُ ليست في `gate-summary` فلا تحجب دمجاً. تقيس أوّلاً **الحتميّةَ** (كلُّ لقطةٍ تُلتقط
#  مرّتين في التشغيل نفسِه ويجب أن تتطابق) ثمّ الفرقَ عن أساس `main`؛ فتُضبط العتباتُ من أرقامٍ مقيسةٍ لا من تخمين،
#  وبعد أن يثبت الاستقرارُ تُرفع إلى بوّابةٍ (بند VI-13 في الخارطة).
#
#  الأساس: تشغيلٌ على `main` يرفع `visual-baseline` (لا صورَ في git — المستودعُ عامّ). وطلبُ الدمج يُنزّل آخرَ أساسٍ ناجحٍ ويقارن به.
#  الاعتماد: وسمُ «تغيير-بصريّ» على الطلب يجعل الفرقَ ملخّصاً لا فشلاً (سابقةُ «نشر-عاجل»)، وتُنشر صورُ الفرق في الـartifact.
# ══════════════════════════════════════════════

on:
  # لا `push` إلى main: كلُّ check-run على إيداع main تنتظره Railway («Wait for CI») وهذا الفحصُ أبطؤُها (7–8 د) فكان يؤخّر النشرَ بقدره
  # (قياس W-20261014-003: 7 د 27 ث من 14 د 05 ث). قرارُ المالك 2026-10-14: غيرُ حاجبٍ للنشر بعد الدمج، ويبقى على طلب الدمج.
  # الأساسُ يُرفع يومياً (02:00 UTC = 05:00 الدوحة، خارجَ دفعتَي النشر 14:30/19:00) أو يدوياً.
  schedule:
    - cron: "0 2 * * *"
  pull_request:
    branches: [main]
    paths:
      - "templates/**"
      - "static/css/**"
      - "static/js/**"
      - "core/templatetags/**"
      - "tests/visual_snapshots.py"
      - "tests/e2e/test_visual_snapshots_live.py"
      - ".github/workflows/visual-snapshots.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: visual-snapshots-${{ github.ref }}
  # طلبُ الدمج يُلغي تشغيلَه القديم؛ أمّا `main` فلا: الأساسُ يُرفع من تشغيلٍ ناجحٍ وحدَه، ودمجان متتاليان كانا يُلغيان أوّلَ تشغيلٍ فلا يبقى أساسٌ (2026-09-25).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  snapshots:
    name: لقطات الهويّة — حتميّةٌ ومقارنة
    # صورةٌ ثابتةٌ باسمها الصريح لا `latest` (W-20261017-015): انتقالُ latest بين إصداراتِ Ubuntu يغيّر الخطوطَ والرسم فيقلب الأساسَ.
    # إصدارُ Playwright (فـChromium) مثبَّتٌ في requirements.txt (1.63.0)، وأعلامُ الرسم الحتميّ في test_visual_snapshots_live.py.
    runs-on: ubuntu-24.04

    env:
      DJANGO_SETTINGS_MODULE: shschool.settings.testing
      SECRET_KEY: ci-testing-only-not-for-production-use-a1b2c3d4e5f6  # pragma: allowlist secret
      FERNET_KEY: dGVzdC1mZXJuZXQta2V5LTMyLWJ5dGVzLWZvcmNpLS0=  # pragma: allowlist secret
      EXCEL_PROTECTION_PASSWORD: ci-testing-only
      # Playwright يستعمل حلقةَ أحداثٍ داخليّةً تُخطئ حارسَ Django غير المتزامن (كما في axe-a11y).
      DJANGO_ALLOW_ASYNC_UNSAFE: "1"
      VISUAL_SNAPSHOTS: "1"
      VISUAL_OUT: visual-out
      # الوسمُ اعتمادٌ للتغيير المقصود: الفرقُ يُنشر ولا يُفشل.
      VISUAL_ALLOW_CHANGES: ${{ contains(github.event.pull_request.labels.*.name, 'تغيير-بصريّ') && '1' || '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # postgres + redis أصليّان على الـrunner بدل حاويتَي خدمةٍ تُسحبان من Docker Hub (سقفُ السحب غيرُ الموثَّق: toomanyrequests) — W-20261010-016
      - uses: ./.github/actions/native-postgres
        with:
          redis: "true"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: تثبيت مكتبات النظام (Cairo + WeasyPrint)
        run: |
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure*
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev \
            libpango1.0-dev \
            libgdk-pixbuf2.0-dev \
            libffi-dev \
            shared-mime-info \
            pkg-config

      - name: تثبيت المتطلبات
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-django factory-boy pytest-playwright==0.9.0

      # Chromium وحدَه: اللقطةُ مقارنةُ بكسلاتٍ لا اختبارُ محرّكات (WebKit على لينكس ليس iOS).
      - name: تثبيت Chromium (مع مكتبات النظام)
        run: playwright install --with-deps chromium

      - name: تطبيق Migrations
        run: python manage.py migrate --noinput

      - name: أساسُ main (إن وُجد)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # أحدثُ artifact أساسٍ غيرِ منتهٍ — لا «أحدثُ تشغيلٍ ناجح»: التشغيلُ الذي فشلت لقطاتُه على main يصير الآن «ناجحاً» (D-277م) ولا أساسَ فيه.
          run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=visual-baseline&per_page=20" --jq '[.artifacts[] | select(.expired == false)][0].workflow_run.id // empty')
          base_sha=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=visual-baseline&per_page=20" --jq '[.artifacts[] | select(.expired == false)][0].workflow_run.head_sha // empty')
          if [ -n "$run_id" ] && gh run download "$run_id" --name visual-baseline --dir visual-baseline; then
            echo "VISUAL_BASELINE_DIR=visual-baseline" >> "$GITHUB_ENV"
            echo "VISUAL_BASELINE_SHA=${base_sha}" >> "$GITHUB_ENV"
            echo "أساسُ main من التشغيل $run_id"
          else
            echo "::notice::لا أساسَ من main بعدُ (أو انتهى احتفاظُه) — تُقاس الحتميّةُ وحدَها"
          fi

      # تقادمُ الأساس (W-20261024-003): الأساسُ يُرفع يومياً فقط، فبعد دمجٍ يمسّ الصفحات يقارن الطلبُ بأساسٍ قديمٍ فيرى فرقَ main لا فرقَه (#1255: 6 لقطاتٍ زائفة).
      # الحلّ دون `push` إلى main (قرارُ المالك 2026-10-14: لا check-run إضافياً يؤخّر Railway): إن كان في main ما يتجاوز الأساسَ بغير الوثائق، يُبنى الأساسُ من رأس main داخل تشغيل الطلب.
      # فشلُ البناء لا يُفشل التشغيل: يبقى الأساسُ المنزَّلُ كما كان.
      - name: تجديدُ الأساس من main إن تقادم
        if: github.event_name == 'pull_request' && env.VISUAL_BASELINE_SHA != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          if [ "$main_sha" = "$VISUAL_BASELINE_SHA" ]; then
            echo "الأساسُ حديثٌ (يطابق رأس main)"; exit 0
          fi
          changed=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/compare/${VISUAL_BASELINE_SHA}...${main_sha}" --jq '.files[].filename' | grep -vE '^(docs/|AAdocs/)|\.md$' || true)
          if [ -z "$changed" ]; then
            echo "main تجاوز الأساسَ بوثائقَ فقط — الأساسُ صالح"; exit 0
          fi
          echo "::notice::الأساسُ (${VISUAL_BASELINE_SHA:0:8}) أقدمُ من main (${main_sha:0:8}) — يُبنى أساسٌ جديدٌ من رأس main"
          git fetch --depth=1 origin "$main_sha"
          git worktree add ../main-base "$main_sha"
          cd ../main-base
          python manage.py migrate --noinput
          VISUAL_BASELINE_DIR="" VISUAL_OUT="$GITHUB_WORKSPACE/visual-main" python -m pytest tests/e2e/test_visual_snapshots_live.py -v
          echo "VISUAL_BASELINE_DIR=$GITHUB_WORKSPACE/visual-main/shots" >> "$GITHUB_ENV"
          # لا ترحيلَ بعد البناء: pytest-django يهدم القاعدةَ عند ختام الجلسة، واختبارُ اللقطات يبنيها من جديدٍ لمخطّط الطلب.

      # المهلةُ على الخطوة لا الوظيفة: `test_ci_suite_parity` يقرأ مهلةَ الوظيفة ميزانيّةَ مجموعةٍ كاملةٍ تلزمها الموازاة، وهذه مساراتٌ محدَّدة.
      # D-277م (أمر المالك المباشر، 2026-10-08): الفحصُ استشاريٌّ بنصّه فلا يحجب النشر. على `push` إلى main يفشل الاختبارُ ولا يُحمّر المهمّةَ
      # (Railway «Wait for CI» يتخطّى النشرَ إن فشل أيُّ check-run في المجموعة ولو لم يكن مطلوباً بحماية الفرع)؛ وعلى طلب الدمج يبقى الفشلُ
      # كما كان (استشاريّاً: ليس في gate-summary). وما يُرفع أساساً يُقرأ من `steps.snap.outcome` لا من `success()` فلا يُرفع أساسٌ من تشغيلٍ فاشل.
      - name: اللقطات (حتميّةٌ ومقارنة)
        id: snap
        timeout-minutes: 20
        continue-on-error: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        run: python -m pytest tests/e2e/test_visual_snapshots_live.py -v

      - name: "تحذيرٌ — فشلت اللقطاتُ على main (غيرُ حاجبٍ للنشر)"
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.snap.outcome == 'failure'
        run: |
          echo "::warning title=VI-13::فشل فحصُ لقطات الهويّة على main — استشاريٌّ لا يحجب النشرَ (D-277م). راجع الملخّصَ وartifact المقارنة."
          {
            echo "## ⚠ لقطات الهويّة فشلت على main (غيرُ حاجبٍ للنشر — D-277م)"
            echo
            echo "الفشلُ استشاريٌّ: لا يُحمّر المهمّةَ ولا يحجب «Wait for CI». لا يُرفع أساسٌ من هذا التشغيل."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: الملخّص في صفحة التشغيل
        if: always()
        run: |
          if [ -f visual-out/summary.md ]; then
            {
              echo "## لقطات الهويّة البصريّة"
              echo
              cat visual-out/summary.md
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: رفعُ اللقطات والفروق
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: visual-current-${{ github.sha }}
          path: visual-out
          retention-days: 14
          if-no-files-found: ignore

      # الأساس: لقطاتُ main وحدَها (بلا التكرار ولا الفروق) — يُنزَّل في طلباتِ الدمج التالية.
      - name: رفعُ أساس main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.snap.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: visual-baseline
          path: visual-out/shots
          retention-days: 30
