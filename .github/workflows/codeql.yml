name: CodeQL — تحليل ثابت إضافي

# طبقةُ SAST ثانية إلى جانب bandit (`security-scan.yml`) — لا بديلاً عنه.
# bandit يفحص أنماطاً معروفة بقواعد ثابتة، وCodeQL يتتبّع تدفّق البيانات عبر
# الاستدعاءات (taint tracking) فيكشف ما لا تراه قاعدةٌ منفردة، في بايثون
# وجافاسكربت معاً (static/js/ ليست مبنيّة، فلا خطوة build مطلوبة هنا).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    - cron: "0 5 * * 1"  # كل اثنين 5:00 UTC
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL — ${{ matrix.language }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript]
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
