name: Rollback — التراجعُ إلى commit سابق

# ══════════════════════════════════════════════════════
#  كيف يتراجع الإنتاجُ فعلاً
# ══════════════════════════════════════════════════════
#
# Railway ينشر من تكامل GitHub لحظةَ وصول commit إلى `main` — لا من هذا
# المستودع ولا من Actions. وكانت هذه الوظيفةُ تعمل `git checkout <sha>` على
# عدّاء CI (لا أثرَ له في أيّ مكان) ثمّ تستدعي `RAILWAY_DEPLOY_WEBHOOK`، وهو
# سرٌّ أُزيل من `deploy-railway.yml` لأنّه مصدرُ نشرٍ ثانٍ مخبّأ — فكانت «تتراجع»
# بنجاحٍ أخضر ولا يتغيّر شيء. ولا `RAILWAY_TOKEN` في أسرار المستودع ولا في
# بيئة `production` (تحقّقٌ بـ`gh secret list` يوم 2026-09-14)، فلا CLI ولا API.
#
# فالتراجعُ الصادق الوحيدُ من هنا هو ما يُغيّر `main`:
#
#   ١. `revert-pr` (الافتراضيّ): إيداعٌ جديدٌ فوق `main` شجرتُه شجرةُ الهدف
#      حرفيّاً (`git commit-tree`) — لا `git revert` لكلّ إيداعٍ على حدة، فذاك
#      يتعثّر بإيداعات الدمج ويحتاج `-m 1` — ثمّ طلبُ دمجٍ يمرّ على البوّابات
#      كأيّ طلب. دمجُه يدفع Railway إلى نشر شجرة الهدف، والكناري في
#      `deploy-railway.yml` يُثبت أنّ الإيداعَ الجديد صار حيّاً.
#
#   ٢. `verify_only`: بعد الدمج (أو بعد تراجعٍ يدويّ من لوحة Railway) — يقارن
#      `commit` الذي يخدمه `/health/` بالـSHA المطلوب، ويفشل بصوتٍ عالٍ إن خالفه.
#
# والطريقُ اليدويّ حين يكون GitHub نفسُه هو العطب:
#   Railway → Project → web → Deployments → النشرُ السابق السليم → ⋯ → Rollback
#   (والعامل `worker` كذلك إن كان التغييرُ يمسّه). ثمّ شغّل هذه الوظيفة بـ
#   `verify_only=true` وSHA النشر الذي عُدت إليه.

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "SHA الهدف: ما يُراد أن يخدمه الإنتاج (كاملاً أو 7 خانات)"
        required: true
        type: string
      reason:
        description: "سببُ التراجع (يُكتب في طلب الدمج)"
        required: false
        type: string
        default: "تراجعٌ يدويّ"
      verify_only:
        description: "لا تُنشئ طلبَ دمج — تحقّق فقط أنّ الإنتاج يخدم commit_sha"
        required: false
        type: boolean
        default: false

concurrency:
  group: railway-deploy
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  PRODUCTION_URL: ${{ secrets.PRODUCTION_URL || 'https://shschoolmvp-production.up.railway.app' }}

jobs:
  # ══════════════════════════════════════════════════════
  #  1. طلبُ دمجٍ يُعيد شجرةَ main إلى شجرة الهدف
  # ══════════════════════════════════════════════════════
  revert-pr:
    name: طلبُ دمجِ التراجع إلى ${{ inputs.commit_sha }}
    if: ${{ !inputs.verify_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0 # التاريخُ كاملاً — الهدفُ قد يكون قديماً

      - name: التحقّق من الهدف
        id: target
        run: |
          set -euo pipefail
          TARGET="$(git rev-parse --verify --quiet '${{ inputs.commit_sha }}^{commit}' || true)"
          if [ -z "$TARGET" ]; then
            echo "::error::لا commit بهذا الـSHA في المستودع: ${{ inputs.commit_sha }}"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$TARGET" origin/main; then
            echo "::error::$TARGET ليس سلفاً لـmain — التراجعُ يكون إلى ما كان على main يوماً"
            exit 1
          fi
          if [ "$(git rev-parse "$TARGET^{tree}")" = "$(git rev-parse 'origin/main^{tree}')" ]; then
            echo "::error::شجرةُ main هي شجرةُ الهدف أصلاً — لا شيءَ يُتراجَع عنه"
            exit 1
          fi
          echo "sha=$TARGET" >> "$GITHUB_OUTPUT"
          echo "short=${TARGET:0:7}" >> "$GITHUB_OUTPUT"
          {
            echo "## التراجع"
            echo "| البند | القيمة |"
            echo "|-------|--------|"
            echo "| الهدف | \`$TARGET\` |"
            echo "| رسالتُه | $(git log --format=%s -1 "$TARGET") |"
            echo "| تاريخُه | $(git log --format=%ci -1 "$TARGET") |"
            echo "| ما يُلغى | $(git rev-list --count "$TARGET..origin/main") إيداعاً على main بعده |"
            echo "| السبب | ${{ inputs.reason }} |"
            echo "| طلبه | ${{ github.actor }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: إيداعٌ شجرتُه شجرةُ الهدف، على فرعٍ جديد
        id: branch
        env:
          TARGET: ${{ steps.target.outputs.sha }}
          SHORT: ${{ steps.target.outputs.short }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          BRANCH="rollback/${SHORT}-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          NEW=$(git commit-tree "$TARGET^{tree}" -p origin/main \
            -m "revert: التراجعُ إلى ${SHORT} — ${REASON}" \
            -m "شجرةُ هذا الإيداع هي شجرةُ ${TARGET} حرفيّاً؛ ما بعده على main يُلغى أثرُه دون حذف تاريخه." \
            -m "Rollback-Target: ${TARGET}")
          git branch "$BRANCH" "$NEW"
          git push origin "$BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "commit=$NEW" >> "$GITHUB_OUTPUT"

      - name: فتحُ طلب الدمج
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.name }}
          TARGET: ${{ steps.target.outputs.sha }}
          SHORT: ${{ steps.target.outputs.short }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          BODY=$(cat <<EOF
          ## تراجعٌ إلى \`${SHORT}\`

          **السبب:** ${REASON}
          **طلبه:** @${{ github.actor }} — [التشغيل](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

          هذا الإيداعُ يُعيد شجرةَ \`main\` إلى شجرة \`${TARGET}\` حرفيّاً (\`git commit-tree\`)،
          فيُلغي أثرَ كلّ ما دُمج بعده دون حذف تاريخه.

          ### ما بعد الدمج
          - Railway ينشر تلقائيّاً، والكناري في \`deploy-railway.yml\` يُثبت أنّ إيداعَ الدمج صار حيّاً.
          - وللتحقّق اليدويّ: \`gh workflow run rollback.yml -f commit_sha=<SHA إيداع الدمج> -f verify_only=true\`.
          - **الهجرات لا تُتراجَع تلقائيّاً**: إن كان بين الهدف وmain هجرةٌ حذفت عموداً أو جدولاً فالبياناتُ ذهبت،
            وإن أضافت عموداً فيبقى العمودُ بلا شيفرةٍ تقرؤه — راجع \`git diff ${SHORT}..main -- '*/migrations/*'\` قبل الدمج.

          ### إن لم تبدأ الفحوصُ على هذا الطلب
          طلبٌ يفتحه \`GITHUB_TOKEN\` لا يُطلق سيرَ عملٍ آخر (قاعدةُ GitHub). أغلقه وأعد فتحه
          (\`gh pr close\` ثمّ \`gh pr reopen\`) أو ادفع إيداعاً فارغاً على الفرع — فتبدأ البوّابات.

          ### إن كان GitHub نفسُه هو العطب
          Railway → web → Deployments → النشرُ السابق السليم → Rollback (والعامل \`worker\` كذلك إن لزم).
          EOF
          )
          URL=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "revert: التراجعُ إلى ${SHORT} — ${REASON}" \
            --body "$BODY" \
            --label rollback 2>/dev/null \
            || gh pr create --base main --head "$BRANCH" \
                 --title "revert: التراجعُ إلى ${SHORT} — ${REASON}" --body "$BODY")
          echo "طلبُ الدمج: $URL"
          {
            echo ""
            echo "طلبُ الدمج: $URL"
            echo ""
            echo "**التراجعُ لا يقع قبل دمجه.** بعد الدمج يُثبت كناري \`deploy-railway.yml\` أنّه صار حيّاً."
          } >> "$GITHUB_STEP_SUMMARY"

  # ══════════════════════════════════════════════════════
  #  2. التحقّق: هل يخدم الإنتاجُ الهدفَ فعلاً؟
  # ══════════════════════════════════════════════════════
  verify:
    name: التحقّق أنّ الإنتاج يخدم ${{ inputs.commit_sha }}
    if: ${{ inputs.verify_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: مقارنةُ commit من /health/ بالهدف
        run: |
          set -uo pipefail
          WANT="$(echo '${{ inputs.commit_sha }}' | cut -c1-7)"
          echo "الهدف: $WANT — على $PRODUCTION_URL/health/"
          SERVED=""; HTTP_CODE="000"
          # ١٨ محاولة × (١٥ث + ٢٥ث) ≈ ١٢ دقيقة — زمنُ بناءٍ ونشرٍ على Railway.
          for attempt in $(seq 1 18); do
            HTTP_CODE=$(curl -s -o /tmp/health.json -w "%{http_code}" --max-time 15 "$PRODUCTION_URL/health/" 2>/dev/null || echo "000")
            SERVED=$(python3 -c "import sys,json; print(json.load(open('/tmp/health.json')).get('commit',''))" 2>/dev/null || echo "")
            echo "المحاولة $attempt: HTTP $HTTP_CODE | served=${SERVED:-?} want=$WANT"
            if [ "$HTTP_CODE" = "200" ] && [ "$SERVED" = "$WANT" ]; then
              {
                echo "## التحقّق من التراجع"
                echo "| البند | القيمة |"
                echo "|-------|--------|"
                echo "| الهدف | \`$WANT\` |"
                echo "| ما يخدمه الإنتاج | \`$SERVED\` |"
                echo "| /health/ | HTTP $HTTP_CODE |"
                echo "| الحكم | PASS — الإنتاجُ على الهدف |"
              } >> "$GITHUB_STEP_SUMMARY"
              cat /tmp/health.json
              exit 0
            fi
            [ "$attempt" -lt 18 ] && sleep 25
          done
          {
            echo "## التحقّق من التراجع"
            echo "| البند | القيمة |"
            echo "|-------|--------|"
            echo "| الهدف | \`$WANT\` |"
            echo "| ما يخدمه الإنتاج | \`${SERVED:-?}\` |"
            echo "| /health/ | HTTP $HTTP_CODE |"
            echo "| الحكم | FAIL — الإنتاجُ ليس على الهدف |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::الإنتاجُ يخدم '${SERVED:-?}' (HTTP $HTTP_CODE) لا الهدفَ $WANT — التراجعُ لم يقع. الطريقُ اليدويّ في رأس هذا الملفّ."
          exit 1
