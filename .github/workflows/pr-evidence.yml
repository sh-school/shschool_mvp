name: حزمةُ الأدلّة — تعليقٌ آليٌّ على كلّ طلب دمج (MAE-09، المرحلة 1)

# ══════════════════════════════════════════════════════
#  تعليقٌ واحدٌ يُحدَّث في مكانه على كلّ طلب: الخطورةُ من المسارات، وسطرُ اعتماد المالك،
#  والهجراتُ، والمساراتُ المحظورةُ على الدمج الآليّ. المنطقُ كلُّه في scripts/pr_evidence.py
#  (وتحرسه tests/test_pr_evidence.py).
#  **معلوماتيٌّ لا بوّابة**: لا يفشل ولا يمنع دمجاً (الفشلُ عند تجاوز ميزانيّةٍ مقيسةٍ هو المرحلة 2).
#  يُعاد عند تعديل وصف الطلب (edited) فيظهر سطرُ الاعتماد متى أُضيف.
#  الطلباتُ من نسخٍ شقيقةٍ (fork) رمزُها للقراءة وحدَها: تطبع الأداةُ إشعاراً وتنجح.
# ══════════════════════════════════════════════════════

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]

concurrency:
  group: pr-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  evidence:
    name: حزمةُ الأدلّة
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: تعليقُ حزمة الأدلّة
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: python3 scripts/pr_evidence.py "$PR_NUMBER" --repo "$REPO" --post

  # المسارات الحسّاسة (W-20261002-005): وسمٌ وتعليقٌ حين يمسّ الطلبُ ما في security/sensitive_paths.json.
  # القائمةُ تُقرأ من فرع الأساس لا من رأس الطلب (وإلا أفرغها طلبٌ)، ولا pull_request_target.
  # غيابُ القائمة أو فسادُها أو فشلُ نشر الوسم يُفشل الخطوة بصوتٍ عالٍ؛ ومسٌّ حسّاسٌ وحدَه لا يُفشلها (لا حجبَ آليّ).
  sensitive-paths:
    name: المسارات الحسّاسة
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: وسمُ الطلب الذي يمسّ مساراً حسّاساً
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          # الأداةُ نفسُها من فرع الأساس لا من رأس الطلب: طلبٌ يعدّلها لا يعطّل الفحص (وهي ضمن المسارات الإلزامية فيُوسَم)
          TOOL="$(mktemp)"
          if ! git show "origin/$BASE_REF:scripts/ci_sensitive_paths.py" > "$TOOL"; then
            echo "::error::scripts/ci_sensitive_paths.py غائبةٌ في فرع الأساس"
            exit 2
          fi
          if [ "$FORK" = "true" ]; then
            # نسخةٌ شقيقةٌ رمزُها للقراءة وحدَها: يُفحص ويُطبع ولا يُنشر
            python3 "$TOOL" scan --base "origin/$BASE_REF"
          else
            python3 "$TOOL" scan --base "origin/$BASE_REF" --post "$PR_NUMBER" --repo "$REPO"
          fi
