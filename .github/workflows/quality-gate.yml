name: Quality Gate — بوابة الجودة الإلزامية

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
  # طابورُ الدمج: الفحصُ الإلزاميُّ يُشغَّل على «main + الطلب» قبل الدمج، فلا يُطلب
  # تحديثُ الفرع يدويّاً كلّما دمجت محادثةٌ أخرى (قرارُ 2026-09-13).
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ══════════════════════════════════════════════════════
  #  1. pytest + عتبةُ التغطية (الرقمُ في pyproject.toml وحدَه)
  # ══════════════════════════════════════════════════════
  #
  # إصدارٌ واحد: 3.12 — ما تُفحص عليه البوّاباتُ ويعمل عليه الإنتاج
  # (`Dockerfile: python:3.12-slim`). إصدارٌ جديد = سطرٌ هنا + Dockerfile + pyproject.
  #
  # **مقسومةٌ على shards (W-20261002-034):** كانت وظيفةً واحدةً ~17 دقيقةً ثمّ ~33 بعد #777. الآن:
  #   · `pytest-shards`: مصفوفةُ خمسةٍ، كلٌّ تجمع المجموعةَ كلَّها بقواعد pytest نفسِها وتُسقط ما ليس لها
  #     (tests/ci_sharding.py — قسمةٌ حتميّةٌ على ملفّ الاختبار، والملفُّ الثقيلُ مثبَّتٌ على آخرها) وتكتب بياناتِ
  #     تغطيتها `.coverage.shardN` بلا حكم (`--cov-fail-under=0`: التغطيةُ الجزئيّةُ لا تُقاس بالعتبة).
  #   · `test-coverage` («pytest — تغطية» — الاسمُ لم يتغيّر): يتحقّق أنّ الـshards غطّت المجموعةَ بلا فقدٍ
  #     (scripts/ci_shard_verify.py) ثمّ يدمج التغطيةَ ويحكم بعتبة pyproject — الرقمُ الوحيدُ في المستودع.
  pytest-shards:
    name: pytest shard ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]

    env:
      DJANGO_SETTINGS_MODULE: shschool.settings.testing
      SECRET_KEY: ci-testing-only-not-for-production-use-a1b2c3d4e5f6
      FERNET_KEY: dGVzdC1mZXJuZXQta2V5LTMyLWJ5dGVzLWZvcmNpLS0=
      EXCEL_PROTECTION_PASSWORD: ci-testing-only
      CI_SHARD_COUNT: ${{ strategy.job-total }}
      CI_SHARD_INDEX: ${{ matrix.shard }}

    steps:
      - uses: actions/checkout@v7
        with:
          # حسابُ BASE...HEAD يلزمه التاريخُ (على الطلب وحدَه؛ ما سواه لا يحسب فروقاً)
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

      # طلبٌ وثائقيٌّ (.md تحت docs/ وAAdocs/ حصراً): لا تُتخطّى المجموعةُ بل يُشغَّل «قرّاءُ الوثائق» وحدَهم
      # (scripts/ci_docs_only.py) — فمن الاختبارات ما يقرأ وثيقةً ويفشل بتعديلها. والمرشّحُ داخلَ المهمّة لا
      # `paths-ignore` (الأخير يحجب السياقَ فيتعلّق الطلب). وعلى push وطابور الدمج تشغيلٌ كاملٌ دائماً، وأيُّ
      # خطأٍ في الحساب ⇒ كامل. ولا تفشل هذه الخطوةُ أبداً.
      - name: تصنيف الطلب — وثائقيٌّ فقط؟
        id: diff
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/ci_docs_only.py classify "$BASE_SHA" >> "$GITHUB_OUTPUT" || echo "docs_only=false" >> "$GITHUB_OUTPUT"

      # على طلبٍ وثائقيٍّ لا يعمل إلّا shard 1 («قرّاءُ الوثائق»)؛ فلا تُجهَّز البيئةُ في 2–5 هدراً (مراجعة 0105).
      # postgres 16 الأصليّ على الـrunner بدل حاويةٍ تُسحب من Docker Hub (سقفُ السحب أسقط الفحوصَ 2026-10-09)
      - uses: ./.github/actions/native-postgres
        if: steps.diff.outputs.docs_only != 'true' || matrix.shard == 1
        with:
          redis: "true"  # tests/test_channel_layer_redis_integration.py يحتاج redis حقيقياً

      - uses: actions/setup-python@v7
        if: steps.diff.outputs.docs_only != 'true' || matrix.shard == 1
        with:
          python-version: "3.12"
          cache: pip

      - name: تثبيت مكتبات النظام (Cairo + WeasyPrint)
        if: steps.diff.outputs.docs_only != 'true' || matrix.shard == 1
        run: |
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure*  # مستودعاتٌ لا نستعملها تُسقط apt-get update حين يسقط توقيعها
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev \
            libpango1.0-dev \
            libgdk-pixbuf2.0-dev \
            libffi-dev \
            shared-mime-info \
            pkg-config

      - name: تثبيت المتطلبات
        if: steps.diff.outputs.docs_only != 'true' || matrix.shard == 1
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-django pytest-cov pytest-asyncio factory-boy \
            pytest-xdist==3.8.0

      # فحوصٌ لا تتغيّر بتغيّر الـshard: مرّةً واحدةً (shard 1) لا خمساً.
      - name: تطبيق Migrations
        if: steps.diff.outputs.docs_only != 'true' && matrix.shard == 1
        run: python manage.py migrate --noinput

      # كانتا في ci.yml وحده، وهو الملفُّ الذي أُزيل لأنّ بقيّته تكرارٌ لهذه البوّابة.
      - name: التحقق من عدم وجود migrations غير مطبّقة
        if: steps.diff.outputs.docs_only != 'true' && matrix.shard == 1
        run: python manage.py makemigrations --check --noinput

      - name: فحص إعدادات Django
        if: steps.diff.outputs.docs_only != 'true' && matrix.shard == 1
        run: python manage.py check --fail-level WARNING

      - name: "pytest — قرّاءُ الوثائق (طلبٌ وثائقيٌّ؛ بلا تغطية لأنّ العتبةَ لا تُقاس على مجموعةٍ جزئيّة)"
        if: steps.diff.outputs.docs_only == 'true' && matrix.shard == 1
        run: python -m pytest -n auto $(python3 scripts/ci_docs_only.py readers)

      - name: "pytest — shard (بلا حكمِ تغطية: الحكمُ للمُجمِّع)"
        if: steps.diff.outputs.docs_only != 'true'
        env:
          COVERAGE_FILE: .coverage.shard${{ matrix.shard }}
          CI_SHARD_REPORT: shard-report-${{ matrix.shard }}.json
        # `-n auto`: المجموعةُ نفسُها تمرّ في CI على الأنوية لا تسلسلاً. و`-p tests.ci_sharding` يقسمها بحسب
        # CI_SHARD_INDEX/COUNT. و`--cov-report=` بلا تقرير و`--cov-fail-under=0`: هذا shard لا يرى إلّا جزءاً.
        run: |
          python -m pytest -p tests.ci_sharding -n auto --junit-xml=test-results-${{ matrix.shard }}.xml \
            --cov=. --cov-report= --cov-fail-under=0

      - name: رفع بيانات الـshard
        uses: actions/upload-artifact@v7
        if: always() && steps.diff.outputs.docs_only != 'true'
        with:
          name: shard-data-${{ matrix.shard }}
          path: |
            .coverage.shard${{ matrix.shard }}
            shard-report-${{ matrix.shard }}.json
            test-results-${{ matrix.shard }}.xml
          include-hidden-files: true
          retention-days: 14

  test-coverage:
    name: pytest — تغطية
    needs: [pytest-shards]
    # دائماً: ليُبلَّغ بنتيجةٍ حتى لو فشل shard (فشلُه يُسقط هذه الوظيفةَ أوّلَ خطوة).
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

      - name: تصنيف الطلب — وثائقيٌّ فقط؟
        id: diff
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/ci_docs_only.py classify "$BASE_SHA" >> "$GITHUB_OUTPUT" || echo "docs_only=false" >> "$GITHUB_OUTPUT"

      - name: نتيجةُ الـshards
        env:
          SHARDS_RESULT: ${{ needs.pytest-shards.result }}
        run: |
          if [ "$SHARDS_RESULT" != "success" ]; then
            echo "::error::pytest-shards لم تنجح (النتيجة: $SHARDS_RESULT) — افتح الـshard الفاشل"
            exit 1
          fi

      - uses: actions/setup-python@v7
        if: steps.diff.outputs.docs_only != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: تنزيل بيانات الـshards
        if: steps.diff.outputs.docs_only != 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: shard-data-*
          path: shards
          merge-multiple: true

      - name: التحقق من أنّ الـshards غطّت المجموعةَ كلَّها
        if: steps.diff.outputs.docs_only != 'true'
        run: python3 scripts/ci_shard_verify.py shards 5

      - name: "دمج التغطية + Coverage Gate"
        if: steps.diff.outputs.docs_only != 'true'
        # العتبةُ ليست هنا: `coverage report` يقرأ `fail_under` من `[tool.coverage.report]` في pyproject.toml —
        # الرقمُ الوحيدُ في المستودع. والمساراتُ في بيانات التغطية مطلقةٌ بجذر مساحة العمل نفسِه في كلّ مهمّة
        # (مسارُ checkout واحد) فيدمجها `combine` بلا `[paths]`.
        run: |
          pip install coverage==7.16.1
          coverage combine shards/.coverage.shard*
          coverage xml -o coverage.xml
          coverage html -d htmlcov
          coverage report

      - name: رفع تقارير التغطية
        uses: actions/upload-artifact@v7
        if: always() && steps.diff.outputs.docs_only != 'true'
        with:
          name: coverage-report
          path: |
            shards/test-results-*.xml
            coverage.xml
            htmlcov/
          retention-days: 14

      - name: ملخص Coverage
        if: always() && steps.diff.outputs.docs_only != 'true'
        # الحالةُ تُحسب بالعتبة نفسِها التي حكمت — تُقرأ من pyproject لا تُكتب هنا.
        run: |
          echo "## نتائج التغطية — Quality Gate" >> $GITHUB_STEP_SUMMARY
          echo "| المقياس | القيمة |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          python3 -c "
          import tomllib
          import xml.etree.ElementTree as ET
          with open('pyproject.toml', 'rb') as f:
              threshold = tomllib.load(f)['tool']['coverage']['report']['fail_under']
          try:
              rate = float(ET.parse('coverage.xml').getroot().attrib['line-rate']) * 100
              status = 'PASS' if rate >= threshold else 'FAIL'
              print(f'| التغطية | {rate:.1f}% |')
              print(f'| الحد الأدنى (pyproject) | {threshold}% |')
              print(f'| الحالة | {status} |')
          except Exception as e:
              print(f'| التغطية | غير متاح ({e}) — الوظيفةُ فشلت |')
          " >> $GITHUB_STEP_SUMMARY

  # ══════════════════════════════════════════════════════
  #  2. Ruff — lint + format
  # ══════════════════════════════════════════════════════
  ruff:
    name: Ruff — lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: تثبيت ruff
        run: pip install ruff==0.4.4

      - name: ruff check
        run: ruff check . --output-format=github

      - name: ruff format --check
        run: ruff format --check .

  # ══════════════════════════════════════════════════════
  #  3. mypy — سقّاطةُ الأنواع (tests/mypy_ratchet.py)
  # ══════════════════════════════════════════════════════
  #
  # كانت `mypy … | head -50 || true` ثمّ `::warning` — فتخضرّ مهما أخرج،
  # والملخّصُ يكتب PASS لفحصٍ لم يحكم قطّ. الآن سقّاطة: العددُ المسجَّل لكلّ
  # ملفٍّ في `tests/mypy_ratchet_baseline.json` لا يزيد، وملفٌّ جديدٌ يبدأ من
  # الصفر، وإن سقط mypy نفسُه سقطت الوظيفة.
  mypy:
    name: mypy — سقّاطة الأنواع
    runs-on: ubuntu-latest
    # push إلى main: يُفحص على الطلب وطابور الدمج قبل الدمج (يُعفى skipped وحدَه في scripts/ci_needs_gate.py)
    if: github.event_name != 'push'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: تثبيت مكتبات النظام (Cairo)
        run: |
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure*  # مستودعاتٌ لا نستعملها تُسقط apt-get update حين يسقط توقيعها
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libcairo2-dev pkg-config

      - name: تثبيت mypy + stubs
        # الإصداراتُ من requirements-mypy.txt وحدَه (OWN-30) — الملفُّ نفسُه الذي يستدعيه requirements-dev.txt،
        # فما يقيسه المطوّرُ محلّيّاً هو ما تحكم به البوّابة. لا إصدارَ حرفيّاً هنا (يحرسه tests/test_mypy_pins_are_one_source.py).
        run: pip install -r requirements-mypy.txt

      - name: تثبيت المتطلبات (لحل أنواع Django)
        run: pip install -r requirements.txt

      - name: فحص الأنواع — core/ و shschool/ (بإعداد pyproject، لا يزيد عن المسجَّل)
        env:
          DJANGO_SETTINGS_MODULE: shschool.settings.testing
          SECRET_KEY: ci-testing-only-not-for-production-use-a1b2c3d4e5f6
          FERNET_KEY: dGVzdC1mZXJuZXQta2V5LTMyLWJ5dGVzLWZvcmNpLS0=
          EXCEL_PROTECTION_PASSWORD: ci-testing-only
        run: python -m tests.mypy_ratchet

  # ══════════════════════════════════════════════════════
  #  3b. migration-linter — لا هجرةَ هدّامةً بلا توسيعٍ ثمّ تقليص (P4-1)
  # ══════════════════════════════════════════════════════
  #
  # django-migration-linter يولّد SQL كلّ هجرةٍ جديدةٍ (منذ فرع الأساس) بـ
  # sqlmigrate ويفحصها: DROP COLUMN/TABLE وRENAME وNOT NULL بلا افتراضٍ كلُّها
  # أخطاءٌ تُسقط الوظيفة. لا يُطبّق شيئاً على القاعدة (sqlmigrate لا يُنفّذ).
  # حادثة 2026-09-11 (حذفُ عمودٍ بهجرةٍ أسقط ثماني صفحاتٍ) من هذا النوع تماماً.
  migration-linter:
    name: مدقّق الهجرات — Expand/Contract
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: shschool.settings.testing
      SECRET_KEY: ci-testing-only-not-for-production-use-a1b2c3d4e5f6
      FERNET_KEY: dGVzdC1mZXJuZXQta2V5LTMyLWJ5dGVzLWZvcmNpLS0=
      EXCEL_PROTECTION_PASSWORD: ci-testing-only

    steps:
      - uses: actions/checkout@v7
        with:
          # التاريخُ كاملاً: `--git-commit-id` يقارن بفرع الأساس، وهو أسلافُ
          # رأس الفرع أصلاً (طلبُ الدمج/طابورُ الدمج) — لا حاجةَ لجلبٍ إضافيّ.
          fetch-depth: 0

      # postgres 16 الأصليّ على الـrunner بدل حاويةٍ تُسحب من Docker Hub (سقفُ السحب أسقط الفحوصَ 2026-10-09)
      - uses: ./.github/actions/native-postgres

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: تثبيت مكتبات النظام (Cairo)
        # بلا هذه: pip يبني pycairo من المصدر (لا عجلةَ منشورةً له على PyPI)
        # ويسقط بـ`Dependency "cairo" not found` — كان يمرّ صدفةً بذاكرة pip
        # المؤقّتة لعجلةٍ بُنيت لإصدارٍ مثبَّتٍ سابقاً، فكشفه أوّلُ ترقية
        # (1.29.0 → 1.29.1، PR #364).
        run: |
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure*  # مستودعاتٌ لا نستعملها تُسقط apt-get update حين يسقط توقيعها
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libcairo2-dev pkg-config

      - name: تحديد الأساس للمقارنة
        run: |
          case "${{ github.event_name }}" in
            pull_request) echo "BASE_SHA=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV" ;;
            merge_group)  echo "BASE_SHA=${{ github.event.merge_group.base_sha }}" >> "$GITHUB_ENV" ;;
            *)            echo "BASE_SHA=$(git rev-parse HEAD~1)" >> "$GITHUB_ENV" ;;
          esac

      - name: تثبيت المتطلبات + المدقّق
        # مجموعةُ pytest نفسُها التي في وظيفة pytest-shards: tests/conftest.py
        # (يُحمَّل تلقائيّاً مع أيّ اختبارٍ تحته) يستورد factory، وpyproject.toml
        # يضبط asyncio_mode — فتُثبَّت الحزمُ كلُّها لا factory-boy وحدَه.
        run: |
          pip install -r requirements.txt
          pip install django-migration-linter==5.2.0 \
            pytest pytest-django pytest-cov pytest-asyncio factory-boy

      - name: التحقّق من أنّ الآلة نفسَها تُسقط عموداً محذوفاً
        # لا تشغيلَ هنا لهجرةٍ حقيقيّة — اختبارٌ حتميّ على المحلّل نفسِه
        # (tests/test_migration_linter_wiring.py)، فلا نثق بأنّ الوظيفة تعمل، نتحقّق.
        run: python -m pytest tests/test_migration_linter_wiring.py -q

      - name: تطبيق الهجرات (الحالةُ التي تُقاس عليها هجراتُ الفرع الجديدة)
        run: python manage.py migrate --noinput

      - name: فحص هجرات الفرع منذ ${{ env.BASE_SHA }}
        run: python manage.py lintmigrations --git-commit-id "$BASE_SHA"

  # ══════════════════════════════════════════════════════
  #  4. Radon — تعقيد حلقي (CC 11-30 = تحذير، CC >= 31 = فشل)
  # ══════════════════════════════════════════════════════
  complexity:
    name: Radon — تعقيد CC ≤ 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: تثبيت radon
        run: pip install radon==6.0.1

      - name: فحص التعقيد الحلقي (CC >= 31 = فشل)
        run: |
          # radon grades: A(1-5) B(6-10) C(11-20) D(21-30) E(31-40) F(41+)
          # --min E catches CC >= 31.
          # Phase 1: block CC >= 31. Phase 2 (future): lower to C (CC 11-30)
          result=$(radon cc . \
            --exclude "*/migrations/*,*/.venv/*,manage.py,scripts/*,*/scripts/*,tests/*,*/tests/*,*/management/commands/*" \
            --min E \
            --show-complexity 2>/dev/null)
          if [ -n "$result" ]; then
            echo "::error::Functions with Critical Complexity (CC >= 31) detected:"
            echo "$result"
            echo ""
            echo "## تعقيد الكود — فشل (CC >= 31)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$result" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          # Warn about moderate complexity (CC 11-30) but don't fail
          warnings=$(radon cc . \
            --exclude "*/migrations/*,*/.venv/*,manage.py,scripts/*,*/scripts/*,tests/*,*/tests/*,*/management/commands/*" \
            --min C --max D \
            --show-complexity 2>/dev/null)
          if [ -n "$warnings" ]; then
            echo "::warning::Functions with moderate complexity (CC 11-30):"
            echo "$warnings"
            echo "## تعقيد الكود — تحذير (CC 11-30)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$warnings" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "## تعقيد الكود — ناجح (CC ≤ 30)" >> $GITHUB_STEP_SUMMARY
          fi

  # ══════════════════════════════════════════════════════
  #  5. detect-secrets — كشف بيانات الاعتماد المسربة
  # ══════════════════════════════════════════════════════
  secrets-scan:
    name: detect-secrets — كشف الأسرار
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # حارسُ الترقيم يقرأ ملفّاتِ الطلبات المفتوحة (`gh pr list`) — قراءةٌ فقط
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: تثبيت detect-secrets
        run: pip install detect-secrets==1.5.0

      - name: حارسُ البيانات الشخصيّة — لا رقمَ شخصيّاً ولا جوّالاً حقيقيّاً في مستودعٍ عامّ
        # المنطقُ كلُّه في `scripts/check_personal_data.py` (وتحرسه `tests/test_personal_data_guard.py`).
        # كان `grep` هنا يستثني `tests/` فبقي فيها رقمٌ حقيقيٌّ لمعلّم، ويحكم على السطر لا على الرمز،
        # ويطبع الأرقامَ كاملةً في هذا السجلّ وهو عامّ. والبياناتُ الحقيقيّةُ في `data/` و`backups/`
        # يتجاهلها git، وهذا الحارسُ يرفض ما يفلت.
        run: python scripts/check_personal_data.py

      - name: حارسُ تصادم الترقيم — ADR ورموزُ القيود عبر main والطلبات المفتوحة
        # المنطقُ في `scripts/check_numbering.py` (وتحرسه `tests/test_numbering_guard.py`). تصادمُ ADR-0008/0009
        # وHC21/HC22 (2026-10-01/02) رصده إنسانٌ بعد الدمج؛ هنا يُرصد قبله: كلُّ فرعٍ أخضرُ وحدَه والتصادمُ بينها.
        # `origin/main` يُجلب لأنّ الاستنساخ سطحيّ؛ والطلباتُ المفتوحة من `gh` بالرمز الافتراضيّ (قراءةٌ فقط).
        env:
          GH_TOKEN: ${{ github.token }}
          OWN_PR: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          python scripts/check_numbering.py ${OWN_PR:+--own-pr "$OWN_PR"}

      - name: فحص الأسرار المسربة — سرٌّ ليس في السجلّ يُسقط البوّابة
        # كان `detect-secrets scan … || true` ثمّ عدٌّ للجديد يُطبع ولا يُقارن —
        # فلا سرَّ كان يُسقط شيئاً. الخطّافُ يقارن كلَّ ملفٍّ متتبَّع بالسجلّ
        # (`.secrets.baseline`، وفيه فلاتر الاستثناء نفسُها) ويخرج بـ1 على أيّ
        # سرٍّ جديد. وخروجُه بـ3 ليس سرّاً: السجلُّ تقادم (رقمُ سطرٍ تحرّك أو سرٌّ
        # مسجَّلٌ زال) — يُطبع تحذيرٌ بأمر التحديث ولا يُسقط، لأنّ الخطّاف لا يصل
        # إلى 3 إلّا وقد وجد صفرَ سرٍّ جديد. ولا xargs: يقسم القائمةَ فتتعدّد
        # الاستدعاءات ويضيع رمزُ الخروج (123).
        #
        # تحديثُ السجلّ (على لينكس — المساراتُ فيه بشرطةٍ أماميّة؛ ويندوز يكتبها
        # بشرطةٍ خلفيّة فلا يطابقها الخطّاف في CI):
        #   detect-secrets scan --all-files --exclude-files '<كما في السجلّ>' \
        #     --exclude-lines '<كما في السجلّ>' > .secrets.baseline
        run: |
          mapfile -t files < <(git ls-files)
          set +e
          detect-secrets-hook --baseline .secrets.baseline "${files[@]}"
          rc=$?
          set -e
          case "$rc" in
            0) echo "لا سرَّ جديداً في ${#files[@]} ملفّاً متتبَّعاً." ;;
            3) echo "::warning::سجلُّ الأسرار تقادم (أرقامُ أسطرٍ تحرّكت أو سرٌّ مسجَّلٌ زال) — أعد توليده وأودعه؛ لا سرَّ جديداً." ;;
            *) echo "::error::سرٌّ جديدٌ ليس في .secrets.baseline (أو انهار detect-secrets، رمز $rc) — راجع المخرَجات أعلاه"; exit 1 ;;
          esac

  # ══════════════════════════════════════════════════════
  #  6. axe-core — وصوليّةٌ على صفحاتٍ مرسومةٍ فعلياً (P2-1، خارطة الهوية البصرية)
  # ══════════════════════════════════════════════════════
  #  `tests/a11y_ratchet.py` يفحص مصدر القالب نصّياً؛ هذا يفتح الصفحةَ في متصفّحٍ
  #  حقيقيّ (Playwright + Chromium) بعد تسجيل دخولٍ فعليّ، ويُشغّل محرّك axe-core
  #  نفسَه — فيُمسك ما لا يظهر في المصدر (تبايناً محسوباً، دَوراً مُركَّباً من
  #  CSS/JS معاً). الخطُّ الأساس لا يبدأ من صفر — سُجِّل بمخالفتين حقيقيّتين
  #  موجودتين فعلاً (2026-09-18)؛ الحارسُ يمنع الزيادة لا يُصلحهما الآن.
  #
  #  **ثلاثُ أرجلٍ متوازية (W-20261009-033):** كانت وظيفةً واحدةً تُشغّل ثلاثَ خطواتٍ متسلسلة (axe، Core Web Vitals،
  #  سقّاطة الجوال) فبلغت 660–900 ث — أطولَ مسارٍ حرج في الدفعة (أبطأ shard لـpytest 560–1045 ث). الآن مصفوفةٌ
  #  بالمعرّف نفسه `axe-a11y`: فنتيجةُ `needs.axe-a11y` تجمع الأرجلَ الثلاث (تنجح إن نجحت كلُّها) ولا يتغيّر
  #  `scripts/ci_needs_gate.py` ولا إعفاءُ push. ولا فحصَ أُلغي: الاختباراتُ الثلاثةُ نفسُها، موزَّعةً لا مُسقَطة.
  #  والفحصان المطلوبان في حماية main هما «ملخص بوابة الجودة» و«Security Summary» وحدَهما (لا اسمَ وظيفةٍ فرعيّة).
  axe-a11y:
    name: axe-core — وصوليّةٌ حيّة (${{ matrix.leg }})
    runs-on: ubuntu-24.04
    # push إلى main: يُفحص على الطلب وطابور الدمج قبل الدمج (يُعفى skipped وحدَه في scripts/ci_needs_gate.py)
    if: github.event_name != 'push'

    strategy:
      # كلُّ رجلٍ تُبلِّغ فشلَها مستقلّةً (لا يُلغي فشلُ إحداها الأخريَين فيُضيع تشخيصُهما).
      fail-fast: false
      matrix:
        include:
          - leg: axe
            tests: tests/test_a11y_axe_ratchet.py
            webkit: false
          - leg: web-vitals
            tests: tests/test_web_vitals_budget.py tests/test_action_cards_fit_narrow_screens.py
            webkit: false
          # سقّاطةُ الجوال (M-00): الجوالُ بالمحرّكَين Chromium وWebKit وسطحُ المكتب بـChromium.
          - leg: mobile
            tests: tests/test_mobile_audit.py
            webkit: true

    env:
      DJANGO_SETTINGS_MODULE: shschool.settings.testing
      SECRET_KEY: ci-testing-only-not-for-production-use-a1b2c3d4e5f6
      FERNET_KEY: dGVzdC1mZXJuZXQta2V5LTMyLWJ5dGVzLWZvcmNpLS0=
      EXCEL_PROTECTION_PASSWORD: ci-testing-only
      # Playwright يستعمل حلقةَ أحداثٍ داخليّةً (greenlet) تُخطئ حارسَ Django غير
      # المتزامن ظنّاً منه أنّه استُدعي من سياقٍ غير متزامن — وهو ليس كذلك، لا
      # استدعاءَ ORM حقيقيّاً من طريقٍ غير متزامن هنا.
      DJANGO_ALLOW_ASYNC_UNSAFE: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/native-postgres
        with:
          redis: "true"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: تثبيت مكتبات النظام (Cairo + WeasyPrint)
        run: |
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure*
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev \
            libpango1.0-dev \
            libgdk-pixbuf2.0-dev \
            libffi-dev \
            shared-mime-info \
            pkg-config

      - name: تثبيت المتطلبات
        # حزمٌ محدّدة لا `requirements-dev.txt` كاملاً — فيه مسافةٌ لتعارضٍ
        # سابقٍ بين click وmutmut غيرِ متعلّقٍ بهذه الوظيفة (كما تفعل وظيفتا
        # pytest وmypy أعلاه، كلٌّ يثبّت ما يحتاجه فقط).
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-django factory-boy \
            pytest-playwright==0.9.0 axe-playwright-python==0.1.8

      # WebKit (محرّكُ iOS Safari) لسقّاطة الجوال وحدها (Q-02)؛ وaxe وCore Web Vitals على Chromium. فيُثبَّت
      # WebKit في رجل الجوال وحدَها ولا تدفع الرجلان الأخريان كلفتَه.
      - name: تثبيت متصفّح Chromium (مع مكتبات النظام)
        run: playwright install --with-deps chromium

      - name: تثبيت متصفّح WebKit (رجل الجوال)
        if: matrix.webkit
        run: playwright install --with-deps webkit

      - name: تطبيق Migrations
        run: python manage.py migrate --noinput

      # الرجلُ تُشغّل اختباراتِها وحدَها؛ و`-s` لميزانية Core Web Vitals (تطبع أرقامَها) ولا يضرّ غيرَها.
      # ولا يُعاد تسمية الوظيفة بما يُغيّر معرّفَها `axe-a11y`: هو المفتاحُ في needs الملخّص وفي إعفاء push.
      - name: "اختباراتُ الرجل: ${{ matrix.leg }}"
        run: python -m pytest ${{ matrix.tests }} -v -s

  # ══════════════════════════════════════════════════════
  #  6b. tests/e2e/ — Playwright: مصادقة، تنقّل، صلاحياتُ أدوار (أُحييت 2026-09-19)
  # ══════════════════════════════════════════════════════
  #  كانت مستثناةً استثناءً مضاعفاً (norecursedirs + collect_ignore_glob) منذ
  #  إنشائها — pytest-playwright نفسُه لم يكن مثبَّتاً، فلم تُجمَع قطّ. فُحص كلُّ
  #  ملفٍّ (6) يدوياً: 17 من 39 اختباراً كانت تفشل فعلياً لأسبابٍ حقيقيّةٍ متعدّدة
  #  (حقلُ دخولٍ قديم، صيغةُ Playwright API غير مدعومة، `locator("nav")` مبهمٌ
  #  بعد صار للصفحة عدّةُ معالم nav، وسياسةُ صلاحياتٍ تغيّرت فعلاً) — أُصلحت
  #  كلُّها، ثمّ أُحيي المجلّدُ هنا. كلُّ ملفٍّ يتخطّى نفسَه بـ
  #  `pytest.importorskip("pytest_playwright")` إن غابت الحزمة (كوظيفة
  #  `pytest — تغطية` الرئيسية).
  e2e:
    name: Playwright — e2e (مصادقة، تنقّل، صلاحيات)
    runs-on: ubuntu-24.04
    # push إلى main: يُفحص على الطلب وطابور الدمج قبل الدمج (يُعفى skipped وحدَه في scripts/ci_needs_gate.py)
    if: github.event_name != 'push'

    env:
      DJANGO_SETTINGS_MODULE: shschool.settings.testing
      SECRET_KEY: ci-testing-only-not-for-production-use-a1b2c3d4e5f6
      FERNET_KEY: dGVzdC1mZXJuZXQta2V5LTMyLWJ5dGVzLWZvcmNpLS0=
      EXCEL_PROTECTION_PASSWORD: ci-testing-only
      DJANGO_ALLOW_ASYNC_UNSAFE: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/native-postgres
        with:
          redis: "true"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: تثبيت مكتبات النظام (Cairo + WeasyPrint)
        run: |
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure*
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev \
            libpango1.0-dev \
            libgdk-pixbuf2.0-dev \
            libffi-dev \
            shared-mime-info \
            pkg-config

      - name: تثبيت المتطلبات
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-django factory-boy pytest-playwright==0.9.0

      - name: تثبيت متصفّح Chromium (مع مكتبات النظام)
        run: playwright install --with-deps chromium

      - name: تطبيق Migrations
        run: python manage.py migrate --noinput

      - name: اختبارات Playwright الشاملة
        run: python -m pytest tests/e2e/ -v

  # ══════════════════════════════════════════════════════
  #  نافذة النشر — الدمجُ إلى main نشرٌ فوريّ (حادثة 2026-09-17)
  # ══════════════════════════════════════════════════════
  #  هنا لا في سير عملٍ مستقلّ: «ملخص بوابة الجودة» هو الفحصُ الإلزاميّ في طابور
  #  الدمج، فالحارسُ خارجه لا يمنع شيئاً. القواعدُ في scripts/deploy_window.py.
  deploy-window:
    name: نافذة النشر — لا دمج وقت الدوام
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - name: الأحد–الخميس 07:00–14:00 بتوقيت قطر ممنوع إلّا «نشر-عاجل»
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
          REPO: ${{ github.repository }}
        run: python3 scripts/deploy_window.py

  # ══════════════════════════════════════════════════════
  #  تحذيرٌ لا حظر — لا يدخل «ملخص بوابة الجودة» ولا يُسقط شيئاً. سواط
  #  2026-09-17: ثلاثةُ طلباتٍ مفتوحةٍ عدّلت base.html في آنٍ واحد بلا علم
  #  أصحابها ببعضهم؛ وقبلها طلبان نفّذا البندَ نفسَه خلال 28 دقيقة. القواعدُ
  #  في scripts/pr_file_collision.py.
  pr-file-collision:
    name: تعارضُ ملفّاتٍ بين الطلبات المفتوحة — تحذير
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - name: مقارنةُ ملفّات هذا الطلب بالطلبات المفتوحة الأخرى
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 scripts/pr_file_collision.py

  # ══════════════════════════════════════════════════════
  #  حرّاسٌ نصّيّةٌ تفشل مبكّراً (W-20261002-031) — تقسيمٌ لا تخفيف
  # ══════════════════════════════════════════════════════
  #
  # الاختباراتُ نفسُها باقيةٌ في pytest الكامل أيضاً (لا استثناءَ بـ--deselect)؛ المكسوبُ أنّ من يخطئ في حارسٍ
  # يراه بعد دقائقَ لا بعد دورةٍ كاملةٍ (postgres وredis وWeasyPrint وmigrate). بلا قاعدةٍ ولا redis.
  # يدخل needs وشرطَ الفشل في الملخّص، ولا يُضاف إلى «الفحوص المطلوبة» في حماية الفرع (قرارُ المالك وحدَه).
  fast-guards:
    name: حرّاسٌ سريعة — فشلٌ مبكّر
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_SETTINGS_MODULE: shschool.settings.testing
      SECRET_KEY: ci-testing-only-not-for-production-use-a1b2c3d4e5f6
      FERNET_KEY: dGVzdC1mZXJuZXQta2V5LTMyLWJ5dGVzLWZvcmNpLS0=
      EXCEL_PROTECTION_PASSWORD: ci-testing-only
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: تثبيت مكتبات النظام (Cairo)
        run: |
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure*
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libcairo2-dev pkg-config

      - name: تثبيت المتطلبات
        run: |
          pip install -r requirements.txt
          pip install pytest-django pytest-asyncio factory-boy

      - name: الحرّاسُ النصّيّة (حجمُ الملفّات، الطبقات، حارسُ المسارات، سقّاطاتُ CSS، حارسُ البوّابة)
        run: |
          python -m pytest -p no:cacheprovider -q \
            tests/test_file_size.py \
            tests/test_layering.py \
            tests/test_every_route_is_guarded.py \
            tests/test_css_budget.py \
            tests/test_css_split.py \
            tests/test_css_layers.py \
            tests/test_css_selectors.py \
            tests/test_css_colours_are_tokens.py \
            tests/test_css_dead_overrides.py \
            tests/test_css_comment_decoration.py \
            tests/test_px_tokens.py \
            tests/test_design_ratchet.py \
            tests/test_regression_guards_doc.py \
            tests/test_ci_gate_needs.py \
            tests/test_ci_docs_only.py

  # ══════════════════════════════════════════════════════
  #  ملخص بوابة الجودة
  # ══════════════════════════════════════════════════════
  gate-summary:
    name: ملخص بوابة الجودة
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read  # لقراءة خطوات وظائف التشغيل (تمييز فشل البنية)
    needs: [pytest-shards, test-coverage, fast-guards, ruff, mypy, migration-linter, complexity, secrets-scan, deploy-window, axe-a11y, e2e]
    if: always()
    steps:
      - uses: actions/checkout@v7

      # أحدُ سياقَين مطلوبَين في حماية `main`. الحكمُ في scripts/ci_needs_gate.py: كلُّ مهمّةٍ في needs يجب أن
      # تنتهي `success` — `skipped` و`cancelled` فشلٌ إلّا الإعفاءَ المعلَّلَ في جدول السكربت (حدثٌ + مهمّةٌ +
      # skipped فقط). مهمّةٌ تُضاف إلى needs تُحكم بلا تعديل هذه الخطوة؛ ويفرض tests/test_ci_gate_needs.py
      # أن تُذكر كلُّ مهمّةٍ في needs أو في قائمة إعفاءٍ معلَّلة.
      # تمييزُ فشل البنية (تجهيزُ الوظيفة/سحبُ الحاويات/postgres الأصليّ) من فشل الشيفرة: تسميةٌ في الملخّص فقط،
      # والحكمُ لا يتغيّر. لا تفشل هذه الخطوةُ أبداً (بلا البيان يُحكم كما كان).
      - name: بيانُ خطوات الوظائف (لتمييز فشل البنية)
        id: jobs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        # ملفٌّ لا متغيّرُ بيئة: ردُّ الوظائف قد يقارب حدَّ Linux للسلسلة الواحدة (128 كيلوبايت) فتسقط الخطوةُ التاليةُ
        # بسبب التمييز نفسه؛ ولا فاصلَ ثابتَ في $GITHUB_ENV يُحقَن من اسم وظيفة.
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100" > "$RUNNER_TEMP/jobs.json" || rm -f "$RUNNER_TEMP/jobs.json"
          echo "INFRA_JOBS_FILE=$RUNNER_TEMP/jobs.json" >> "$GITHUB_ENV"

      - name: حكمُ بوابة الجودة
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci_needs_gate.py "بوابة الجودة — Quality Gate"
