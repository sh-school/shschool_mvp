name: CD — Railway Deploy Pipeline

on:
  push:
    branches: [main]

# التحقّق البَعدي يُثبت **آخر حالة لـmain**، لا حالةً عبَرت.
#
# Railway ينشر خارج Actions. فحين يصل `B` بينما canary(A) ما زال يدور:
#
#     canary(A) يرى  served=B  want=A
#     └─> ينتظر A الذي لن يعود ── ثم يُعلن فشل نشرٍ لم يقع
#
# و`cancel-in-progress: false` كان يضمن بقاء التشغيل الجاري إلى نهايته — أي
# أنه كان يضمن وقوع هذا البلاغ الكاذب لا يمنعه. والإلغاء هو الصواب هنا: نتيجة
# `A` لم تعد مطلوبة أصلاً حين صار `B` رأسَ `main`.
concurrency:
  group: railway-post-deploy-main
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write
  issues: write  # v5.5: auto-create issue on deploy failure

env:
  PRODUCTION_URL: ${{ secrets.PRODUCTION_URL || 'https://shschoolmvp-production.up.railway.app' }}

jobs:
  # ══════════════════════════════════════════════════════
  #  1. Preflight checks (subset safe for CI)
  # ══════════════════════════════════════════════════════
  preflight:
    name: Deploy Preflight Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DJANGO_SETTINGS_MODULE: shschool.settings.testing
      SECRET_KEY: ci-testing-only-not-for-production-use-a1b2c3d4e5f6
      FERNET_KEY: dGVzdC1mZXJuZXQta2V5LTMyLWJ5dGVzLWZvcmNpLS0=
      EXCEL_PROTECTION_PASSWORD: ci-testing-only

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system libraries (Cairo + WeasyPrint)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev libpango1.0-dev libgdk-pixbuf2.0-dev \
            libffi-dev shared-mime-info pkg-config

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: "Preflight: Dependencies check (test 1)"
        run: |
          echo "## Preflight: Dependencies" >> $GITHUB_STEP_SUMMARY
          # Verify all non-dev packages are importable
          python -c "
          import importlib, sys
          failures = []
          packages = [
              ('django', 'django'),
              ('rest_framework', 'djangorestframework'),
              ('psycopg2', 'psycopg2-binary'),
              ('gunicorn', 'gunicorn'),
              ('redis', 'redis'),
          ]
          for mod, pkg in packages:
              try:
                  importlib.import_module(mod)
              except ImportError:
                  failures.append(pkg)
          if failures:
              print(f'Missing: {failures}', file=sys.stderr)
              sys.exit(1)
          print('All core packages importable')
          "
          echo "PASS: Core dependencies importable" >> $GITHUB_STEP_SUMMARY

      - name: "Preflight: Gunicorn config check (test 2)"
        run: |
          python -c "
          import os, runpy, sys
          os.environ.setdefault('PORT', '8000')
          if not os.path.exists('gunicorn.conf.py'):
              print('FAIL: gunicorn.conf.py not found', file=sys.stderr)
              sys.exit(1)
          conf = runpy.run_path('gunicorn.conf.py')
          bind = conf.get('bind', '')
          worker_class = conf.get('worker_class', 'sync')
          print(f'bind={bind}, worker_class={worker_class}')
          if '0.0.0.0' not in str(bind):
              print('FAIL: bind should use 0.0.0.0:\$PORT', file=sys.stderr)
              sys.exit(1)
          print('Gunicorn config OK')
          "
          echo "PASS: Gunicorn config valid" >> $GITHUB_STEP_SUMMARY

      # Tests 3 & 4 (gunicorn boot + health endpoint) skipped in CI
      # Railway handles gunicorn startup; post-deploy smoke test covers health

      - name: "Preflight: Security settings check (test 9)"
        run: |
          if grep -q "SECURE_PROXY_SSL_HEADER" shschool/settings/production.py; then
            echo "PASS: SECURE_PROXY_SSL_HEADER found"
          else
            echo "::error::SECURE_PROXY_SSL_HEADER missing in production.py"
            exit 1
          fi

      - name: "Preflight: Railway config check (test 10)"
        run: |
          python -c "
          import json, sys
          try:
              with open('railway.json') as f:
                  cfg = json.load(f)
              hp = cfg.get('deploy', {}).get('healthcheckPath', '')
              if not hp:
                  print('FAIL: railway.json missing deploy.healthcheckPath', file=sys.stderr)
                  sys.exit(1)
              print(f'healthcheckPath={hp}')
          except FileNotFoundError:
              print('FAIL: railway.json not found', file=sys.stderr)
              sys.exit(1)
          "

      - name: "Preflight: Static files dry-run (test 7)"
        run: |
          python manage.py collectstatic --dry-run --noinput 2>&1 | tee /tmp/static_output.txt
          if grep -qi "error\|traceback" /tmp/static_output.txt; then
            echo "::error::collectstatic --dry-run has errors"
            exit 1
          fi
          echo "PASS: collectstatic dry-run OK"

      - name: "Preflight: Migrations consistency check (test 8)"
        run: python manage.py makemigrations --check --noinput

  # ══════════════════════════════════════════════════════
  #  2. Test suite (pytest + coverage gate)
  # ══════════════════════════════════════════════════════
  test:
    name: pytest — Tests + Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB:       test_db
          POSTGRES_USER:     test_user
          POSTGRES_PASSWORD: test_pass
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: shschool.settings.testing
      SECRET_KEY: ci-testing-only-not-for-production-use-a1b2c3d4e5f6
      FERNET_KEY: dGVzdC1mZXJuZXQta2V5LTMyLWJ5dGVzLWZvcmNpLS0=
      EXCEL_PROTECTION_PASSWORD: ci-testing-only

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev libpango1.0-dev libgdk-pixbuf2.0-dev \
            libffi-dev shared-mime-info pkg-config

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-django pytest-cov pytest-asyncio factory-boy

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Run tests
        run: pytest tests/ -v --junit-xml=test-results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deploy-test-results
          path: |
            test-results.xml
            coverage.xml

  # ══════════════════════════════════════════════════════
  #  3. Post-deploy canary — يُثبت أن الـcommit صار حيّاً
  # ══════════════════════════════════════════════════════
  #
  # لا `needs` على `preflight` ولا على `test`، وهذا مقصود.
  #
  # Railway ينشر من تكامل GitHub لحظةَ وصول الـcommit إلى `main` — قبل هذه
  # الوظيفة بثوانٍ، ومستقلاً عنها تماماً. فحين كانت مربوطة بـ`[preflight, test]`
  # كان سقوط `pytest` — أو تجاوزُه مهلته — **يمنع التحقّق من النشر لا النشرَ
  # نفسه**. أي أن الإنتاج يتغيّر ولا أحد يتحقّق: الضمانة الوحيدة التي تكشف
  # نشراً ميتاً تُلغى في الحالة التي يُرجَّح فيها أن يكون النشر معطوباً.
  #
  # ولم تعد ثمّة وظيفة «تنشر» هنا. أُزيل `RAILWAY_DEPLOY_WEBHOOK` لأنه مصدر
  # نشرٍ ثانٍ مخبّأ داخل سير عملٍ اسمه تحقّقٌ بَعدي — ومصدران للنشر يعنيان
  # سباقاً وبناءين لنفس الـcommit.
  #
  # وأُزيل `sleep 90` كذلك: الحلقة تُميّز النسخة القديمة من الجديدة بمقارنة
  # `served` بـ`want`، فالانتظار الأعمى قبلها يُنفق تسعين ثانية من ميزانية
  # الوظيفة على شيءٍ تفعله المقارنة مجّاناً.
  #
  # الميزانية: ١٨ محاولة × (١٥ث curl + ٢٥ث فاصل) ≈ ١١ د ٣٥ ث، و`timeout-minutes`
  # خمس عشرة. وكانت عشراً بينما مسارها الداخلي يقارب ثلاث عشرة — فتقتلها GitHub
  # في المنتصف وتُسجّلها `cancelled`، وهي حالةٌ لا يقرأها أحد فشلاً.
  post-deploy-canary:
    name: Post-Deploy Canary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: "Canary: Health check gate"
        id: canary
        run: |
          PROD_URL="${{ env.PRODUCTION_URL }}"
          EXPECTED="$(echo '${{ github.sha }}' | cut -c1-7)"
          echo "Canary: التحقّق من أن commit $EXPECTED حيّ على $PROD_URL/health/"

          # fail-closed: يُكتب `false` قبل أي محاولة، فلا يُقلب إلى `true` إلا
          # ببرهان. وأي خروجٍ غير متوقّع — انقطاع، أو قتلٌ عند المهلة — يترك
          # المخرَج على الفشل بدل أن يتركه فارغاً، والفارغ يُقرأ «ليس false»
          # في خطوة الإغلاق فتُغلق قضية فشلٍ لم يُثبت شفاؤها.
          echo "canary_passed=false" >> $GITHUB_OUTPUT
          PASSED=false

          # ينتظر حتى يخدم الإنتاج commit الجديد فعلاً (لا النسخة القديمة) ثم يتحقّق من الصحة.
          for attempt in $(seq 1 18); do
            HTTP_CODE=$(curl -s -o /tmp/canary_health.txt -w "%{http_code}" \
              --max-time 15 "$PROD_URL/health/" 2>/dev/null || echo "000")
            COMMIT=$(cat /tmp/canary_health.txt | python3 -c "import sys,json; print(json.load(sys.stdin).get('commit',''))" 2>/dev/null || echo "")
            echo "Attempt $attempt: HTTP $HTTP_CODE | served=$COMMIT want=$EXPECTED"

            if [ "$HTTP_CODE" = "200" ]; then
              VERSION=$(cat /tmp/canary_health.txt | python3 -c "import sys,json; print(json.load(sys.stdin).get('version','?'))" 2>/dev/null || echo "?")
              # غياب `commit` = UNKNOWN لا PASS. السؤال هنا ليس «أتتنفّس
              # الخدمة؟» بل «أصار الـSHA الذي دُفع حيّاً؟» — وخدمةٌ سليمة تخدم
              # النسخة السابقة تُجيب بنعم على الأوّل وبلا على الثاني، وهي
              # بالضبط صورةُ النشر الفاشل الذي وُضع هذا الفحص لالتقاطه.
              if [ -z "$COMMIT" ]; then
                echo "  ↳ /health/ بلا حقل commit — لا يُثبت شيئاً، تُعاد المحاولة"
              elif [ "$COMMIT" = "$EXPECTED" ]; then
                echo "canary_passed=true" >> $GITHUB_OUTPUT
                echo "deployed_version=$VERSION" >> $GITHUB_OUTPUT
                echo "✅ Canary PASSED — commit $COMMIT (version $VERSION) حيّ وسليم"
                cat /tmp/canary_health.txt
                PASSED=true; break
              else
                echo "  ↳ النسخة القديمة ($COMMIT) ما زالت تخدم — بانتظار $EXPECTED"
              fi
            fi

            if [ "$attempt" -lt 18 ]; then sleep 25; fi
          done

          if [ "$PASSED" != "true" ]; then
            echo "canary_passed=false" >> $GITHUB_OUTPUT
            echo "::error::❌ CANARY FAILED — commit $EXPECTED لا يخدم (آخر HTTP=$HTTP_CODE, served=$COMMIT). نشر Railway فشل غالباً؛ الإنتاج ما زال على النسخة السابقة."
            cat /tmp/canary_health.txt 2>/dev/null || true
          fi

      # ── v5.5: Automated rollback notification ──
      # v5.7: idempotent — يُعلّق على القضية المفتوحة بدل فتح واحدة لكل فشل.
      # كل فشل كان يفتح قضية جديدة، فتراكمت عشر قضايا لحادث واحد متكرّر
      # وأغرقت لوحة القضايا حتى صار الحقيقي منها غير مرئي.
      - name: "Rollback: Open or update the deploy-failure issue"
        if: steps.canary.outputs.canary_passed == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const detail = [
              `**Commit**: \`${context.sha}\``,
              `**Time**: ${new Date().toISOString()}`,
              `**Run**: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `**Health endpoint**: \`${{ env.PRODUCTION_URL }}/health/\``,
              `**Result**: the new commit did not become live.`,
            ].join('\n');

            // ملكية القضية تُحسم بثلاثة شروط معاً:
            //   - ليست PR (GitHub يعامل الـPR كقضية في listForRepo)
            //   - أنشأها github-actions[bot] تحديداً، لا أي بوت
            //   - عنوانها يحمل بادئة النشر الآلي
            // قضية فتحها إنسان ووسمها يدوياً ليست ملكاً لهذا الـworkflow:
            // التعليق عليها ضجيج، وخطوة الإغلاق لن تمسّها فتبقى مفتوحة أبداً.
            const isAutomatedDeployIssue = (item) =>
              !item.pull_request &&
              item.user &&
              item.user.login === 'github-actions[bot]' &&
              typeof item.title === 'string' &&
              item.title.startsWith('🔴 DEPLOY FAILED');

            // sort=updated يضمن أن أول عنصر هو الأحدث لا الأقدم.
            const candidates = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'open',
              labels: 'deploy-failure',
              sort: 'updated',
              direction: 'desc',
              per_page: 100,
            });

            const existing = candidates.data.filter(isAutomatedDeployIssue);

            if (existing.length > 0) {
              const number = existing[0].number;
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: number,
                body: `### فشل نشر إضافي\n\n${detail}`,
              });
              core.setFailed(`Canary health check failed — appended to issue #${number}`);
            } else {
              const created = await github.rest.issues.create({
                ...context.repo,
                title: '🔴 DEPLOY FAILED — canary health check failing',
                body: [
                  `## Deployment Failure — Automated Alert`,
                  ``,
                  detail,
                  ``,
                  `تُحدَّث هذه القضية عند كل فشل لاحق، وتُغلق تلقائياً عند أول نشر ناجح.`,
                  ``,
                  `### Action Required`,
                  `1. Check Railway dashboard for build/deploy errors`,
                  `2. Review Railway deploy logs`,
                  `3. If needed, rollback in Railway dashboard → Deployments → previous deploy → Rollback`,
                  ``,
                  `### Possible Causes`,
                  `- Migration failure`,
                  `- Missing environment variable`,
                  `- Import error in new code`,
                  `- Railway build timeout`,
                ].join('\n'),
                labels: ['bug', 'urgent', 'deploy-failure'],
              });
              core.setFailed(`Canary health check failed — opened issue #${created.data.number}`);
            }

      # v5.7: نشر ناجح ⇒ إغلاق أي قضية فشل مفتوحة (شفاء ذاتي).
      - name: "Rollback: Close stale deploy-failure issues"
        if: steps.canary.outputs.canary_passed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const open = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'open',
              labels: 'deploy-failure',
              sort: 'updated',
              direction: 'desc',
              per_page: 100,
            });

            // نفس شروط الملكية في خطوة الفتح — يجب أن تتطابق الخطوتان تماماً،
            // وإلا فتحت إحداهما قضية لا تُغلقها الأخرى. user.type === 'Bot'
            // وحده كان يشمل بوتات أخرى لا علاقة لها بهذا النشر.
            const automated = open.data.filter(
              (i) =>
                !i.pull_request &&
                i.user &&
                i.user.login === 'github-actions[bot]' &&
                typeof i.title === 'string' &&
                i.title.startsWith('🔴 DEPLOY FAILED'),
            );

            for (const issue of automated) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue.number,
                body: `تم نشر \`${context.sha.substring(0, 7)}\` بنجاح واجتاز فحص canary — تُغلق تلقائياً.`,
              });
              await github.rest.issues.update({
                ...context.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
            }

      - name: Create GitHub deployment status
        if: steps.canary.outputs.canary_passed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              ...context.repo,
              ref: context.sha,
              environment: 'production',
              auto_merge: false,
              required_contexts: [],
              description: `Deploy ${context.sha.substring(0, 7)} to Railway — canary passed`,
              transient_environment: false,
              production_environment: true,
            });
            await github.rest.repos.createDeploymentStatus({
              ...context.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              environment_url: '${{ env.PRODUCTION_URL }}',
              description: `Deployed v${{ steps.canary.outputs.deployed_version }} — canary health check passed`,
            });

  # ══════════════════════════════════════════════════════
  #  4. Post-deploy smoke tests
  # ══════════════════════════════════════════════════════
  smoke-test:
    name: Post-Deploy Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [post-deploy-canary]

    steps:
      - name: "Smoke test: /health/ endpoint (HTTP 200)"
        id: health_check
        run: |
          PROD_URL="${{ env.PRODUCTION_URL }}"
          if [ -z "$PROD_URL" ]; then
            echo "::warning::PRODUCTION_URL secret not set — skipping smoke tests"
            echo "health_ok=skip" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Checking $PROD_URL/health/ ..."

          # Retry up to 5 times (Railway may still be starting)
          for attempt in 1 2 3 4 5; do
            HTTP_CODE=$(curl -s -o /tmp/health_response.txt -w "%{http_code}" \
              --max-time 15 "$PROD_URL/health/" 2>/dev/null || echo "000")

            echo "Attempt $attempt: HTTP $HTTP_CODE"

            if [ "$HTTP_CODE" = "200" ]; then
              echo "health_ok=true" >> $GITHUB_OUTPUT
              echo "Health check passed"
              cat /tmp/health_response.txt || true
              break
            fi

            if [ "$attempt" -lt 5 ]; then
              echo "Retrying in 15s..."
              sleep 15
            fi
          done

          if [ "$HTTP_CODE" != "200" ]; then
            echo "health_ok=false" >> $GITHUB_OUTPUT
            echo "::error::Health check failed — /health/ returned HTTP $HTTP_CODE after 5 attempts"
            cat /tmp/health_response.txt 2>/dev/null || true
          fi

      - name: "Smoke test: / returns HTML"
        id: html_check
        run: |
          PROD_URL="${{ env.PRODUCTION_URL }}"
          if [ -z "$PROD_URL" ]; then
            echo "html_ok=skip" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Checking $PROD_URL/ for HTML response..."

          HTTP_CODE=$(curl -s -o /tmp/index_response.txt -w "%{http_code}" \
            --max-time 15 "$PROD_URL/" 2>/dev/null || echo "000")

          CONTENT_TYPE=$(curl -s -o /dev/null -w "%{content_type}" \
            --max-time 15 "$PROD_URL/" 2>/dev/null || echo "")

          echo "HTTP $HTTP_CODE, Content-Type: $CONTENT_TYPE"

          if echo "$CONTENT_TYPE" | grep -qi "text/html"; then
            echo "html_ok=true" >> $GITHUB_OUTPUT
            echo "HTML response confirmed"
          else
            echo "html_ok=false" >> $GITHUB_OUTPUT
            echo "::warning::Root URL did not return HTML (Content-Type: $CONTENT_TYPE)"
          fi

      - name: Smoke test summary
        if: always()
        run: |
          echo "## Post-Deploy Smoke Test Results" >> $GITHUB_STEP_SUMMARY
          echo "| Test | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY

          HEALTH="${{ steps.health_check.outputs.health_ok }}"
          HTML="${{ steps.html_check.outputs.html_ok }}"

          case "$HEALTH" in
            true)  echo "| /health/ endpoint | PASS |" >> $GITHUB_STEP_SUMMARY ;;
            skip)  echo "| /health/ endpoint | SKIPPED (no PRODUCTION_URL) |" >> $GITHUB_STEP_SUMMARY ;;
            *)     echo "| /health/ endpoint | FAIL |" >> $GITHUB_STEP_SUMMARY ;;
          esac

          case "$HTML" in
            true)  echo "| / HTML response | PASS |" >> $GITHUB_STEP_SUMMARY ;;
            skip)  echo "| / HTML response | SKIPPED (no PRODUCTION_URL) |" >> $GITHUB_STEP_SUMMARY ;;
            *)     echo "| / HTML response | FAIL |" >> $GITHUB_STEP_SUMMARY ;;
          esac

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

          # Fail the job if health check failed
          if [ "$HEALTH" = "false" ]; then
            echo "::warning::DEPLOYMENT MAY BE UNHEALTHY — /health/ check failed. Investigate immediately."
            echo "::error::Smoke test failed for commit ${{ github.sha }}"
            exit 1
          fi
