name: Nightly — المجموعةُ كاملةً بلا توزيع (شبكةُ أمان)

# ══════════════════════════════════════════════════════
#  شبكةُ أمانٍ لبوّابة الجودة
#  - المجموعةُ كلُّها متسلسلةً (بلا -n auto ولا testmon) — فالاختبارُ المتقلّب
#    يظهر هنا حيث لا يُخفيه التوزيع
#  - عتبةُ التغطية هي عتبةُ البوّابة نفسُها: `fail_under` في pyproject.toml،
#    لا رقمَ هنا. كان العنوانُ يقول 85 والعتبةُ 60 والبوّابةُ 70.
#  - الفشلُ يفتح قضيّةً (أو يُعلّق على المفتوحة) ويُغلقها النجاحُ التالي —
#    كما في خطّ النشر؛ كان هنا `TODO: إضافة إشعار` منذ إنشاء الملفّ.
# ══════════════════════════════════════════════════════

on:
  schedule:
    # 02:00 UTC daily = 05:00 Qatar time (AST, UTC+3)
    - cron: "0 2 * * *"
  workflow_dispatch: # allow manual trigger

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  full-pytest:
    name: pytest — المجموعة كاملةً متسلسلةً
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: shschool.settings.testing
      SECRET_KEY: ci-testing-only-not-for-production-use-a1b2c3d4e5f6
      FERNET_KEY: dGVzdC1mZXJuZXQta2V5LTMyLWJ5dGVzLWZvcmNpLS0=
      EXCEL_PROTECTION_PASSWORD: ci-testing-only

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: تثبيت مكتبات النظام (Cairo + WeasyPrint)
        run: |
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure*  # مستودعاتٌ لا نستعملها تُسقط apt-get update حين يسقط توقيعها
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev \
            libpango1.0-dev \
            libgdk-pixbuf2.0-dev \
            libffi-dev \
            shared-mime-info \
            pkg-config

      - name: تثبيت المتطلبات
        run: pip install -r requirements-dev.txt

      - name: تثبيت متصفّح Chromium (مع مكتبات النظام)
        # اختباراتُ Playwright (tests/e2e وaxe والحمولة) تحتاج المتصفّح — وتُشغَّل في خطوةٍ
        # منفصلةٍ أدناه، لأنّ fixture الجلسة تُبقي حلقةَ async قائمةً في العمليّة كلَّها.
        # وWebKit لسقّاطة الجوال (tests/test_mobile_audit.py، محرّكُ iOS Safari).
        run: playwright install --with-deps chromium webkit

      - name: تطبيق Migrations
        run: python manage.py migrate --noinput

      - name: "★ FULL pytest — كل الاختبارات + عتبة pyproject"
        # -p no:cacheprovider: لا cache (كل شيء من الصفر)
        # بدون -n auto (متسلسل — لاكتشاف الاختبار المتقلّب بسهولة)
        # العتبةُ من `[tool.coverage.report].fail_under` — pytest-cov يقرؤها.
        # Playwright خارج هذه العمليّة: حلقةُ async التي يُبقيها fixture الجلسة تُسقط كلَّ
        # اختبارٍ يلمس القاعدةَ بعده بـSynchronousOnlyOperation (27 فشلاً، 2026-09-19).
        # والقائمةُ تُنسى: ملفّان أُضيفا بلا استثناء (#416 في 09-19، و09-22) فسقطت الليالي من 09-20
        # حتّى 09-23. فحارسُ `tests/test_nightly_isolates_browser_tests.py` يُسقط البناءَ إن طلب ملفٌّ
        # `pytest_playwright` ولم يُستثنَ هنا ويُشغَّل في الخطوة المنفصلة أدناه.
        run: |
          python -m pytest \
            --ignore=tests/e2e \
            --ignore=tests/test_a11y_axe_ratchet.py \
            --ignore=tests/test_web_vitals_budget.py \
            --ignore=tests/test_mobile_audit.py \
            --ignore=tests/test_lighthouse_mobile.py \
            --ignore=tests/test_action_cards_fit_narrow_screens.py \
            --ignore=tests/test_page_nav_htmx_process.py \
            --junit-xml=test-results.xml \
            -p no:cacheprovider \
            --cov=. --cov-report=xml:coverage.xml --cov-report=html:htmlcov --cov-report=term

      - name: "Playwright — e2e وaxe والحمولة (عمليّةٌ منفصلة)"
        if: always()
        env:
          # كما في وظيفتَي axe وe2e في quality-gate.yml: fixtures المتصفّح تلمس القاعدةَ
          # من داخل حلقة Playwright. ولا يُضبط على الخطوة الرئيسيّة فيُخفي أعطالاً حقيقيّة.
          DJANGO_ALLOW_ASYNC_UNSAFE: "1"
        run: |
          python -m pytest tests/e2e tests/test_a11y_axe_ratchet.py \
            $(ls tests/test_web_vitals_budget.py 2>/dev/null) \
            tests/test_mobile_audit.py \
            tests/test_action_cards_fit_narrow_screens.py \
            tests/test_page_nav_htmx_process.py \
            -p no:cacheprovider -v

      # Q-03: Lighthouse للجوال على خمس صفحاتٍ رئيسة — ليلاً لا في البوّابة (ثلاثُ دقائق
      # للصفحة، ودرجةُ الأداء تتذبذب)؛ راجع `tests/lighthouse_audit.py`. وNode في المُشغِّل
      # أصلاً لـ`npx lighthouse`، والمتصفّحُ Chromium الذي ثبّته Playwright أعلاه.
      - name: "Lighthouse للجوال — الأداء والوصوليّة (Q-03)"
        if: always()
        env:
          DJANGO_ALLOW_ASYNC_UNSAFE: "1"
          LIGHTHOUSE_RUN: "1"
        run: python -m pytest tests/test_lighthouse_mobile.py -p no:cacheprovider -v -s

      - name: رفع نتائج الاختبارات
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-test-results
          path: |
            test-results.xml
            coverage.xml
            htmlcov/

      - name: ملخص Coverage في GitHub Summary
        if: always()
        run: |
          echo "## Nightly — المجموعة كاملةً" >> $GITHUB_STEP_SUMMARY
          echo "| المقياس | القيمة |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          python3 -c "
          import tomllib
          import xml.etree.ElementTree as ET
          with open('pyproject.toml', 'rb') as f:
              threshold = tomllib.load(f)['tool']['coverage']['report']['fail_under']
          try:
              rate = float(ET.parse('coverage.xml').getroot().attrib['line-rate']) * 100
              status = 'ناجح' if rate >= threshold else 'فاشل'
              print(f'| التغطية | {rate:.1f}% |')
              print(f'| العتبة (pyproject) | {threshold}% — {status} |')
          except Exception as e:
              print(f'| التغطية | غير متاح ({e}) — الوظيفةُ فشلت |')
          " >> $GITHUB_STEP_SUMMARY

      # الفشلُ لا يُترك في سجلّ تشغيلٍ لا يفتحه أحد: قضيّةٌ واحدة، تُعلَّق عند
      # كلّ فشلٍ لاحق وتُغلق عند أوّل نجاح — الملكيّةُ بالشروط الثلاثة نفسِها
      # التي في `deploy-railway.yml` (ليست PR، من github-actions[bot]، بالبادئة).
      - name: "الفشل: فتحُ قضيّةٍ أو التعليقُ على المفتوحة"
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const prefix = '🌙 NIGHTLY FAILED';
            const detail = [
              `**Commit**: \`${context.sha}\``,
              `**Time**: ${new Date().toISOString()}`,
              `**Run**: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `**Result**: المجموعةُ الكاملةُ المتسلسلة فشلت — إمّا اختبارٌ متقلّبٌ يُخفيه التوزيع في البوّابة، أو التغطيةُ دون عتبة pyproject، أو انحدرت درجاتُ Lighthouse للجوال (خطوةُ Q-03).`,
            ].join('\n');
            const isOurs = (item) =>
              !item.pull_request &&
              item.user &&
              item.user.login === 'github-actions[bot]' &&
              typeof item.title === 'string' &&
              item.title.startsWith(prefix);
            const open = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'nightly-failure',
              sort: 'updated', direction: 'desc', per_page: 100,
            });
            const existing = open.data.filter(isOurs);
            if (existing.length > 0) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: existing[0].number,
                body: `### فشلٌ ليليٌّ إضافيّ\n\n${detail}`,
              });
              core.info(`appended to issue #${existing[0].number}`);
            } else {
              const created = await github.rest.issues.create({
                ...context.repo,
                title: `${prefix} — المجموعة الكاملة لا تمرّ`,
                body: [`## Nightly — فشلٌ آليّ`, ``, detail, ``,
                       `تُحدَّث هذه القضيّة عند كلّ فشلٍ لاحق، وتُغلق تلقائيّاً عند أوّل ليلةٍ ناجحة.`].join('\n'),
                labels: ['bug', 'nightly-failure'],
              });
              core.info(`opened issue #${created.data.number}`);
            }

      - name: "النجاح: إغلاقُ قضايا الفشل المفتوحة"
        if: success()
        uses: actions/github-script@v9
        with:
          script: |
            const prefix = '🌙 NIGHTLY FAILED';
            const open = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'nightly-failure',
              sort: 'updated', direction: 'desc', per_page: 100,
            });
            for (const issue of open.data) {
              if (issue.pull_request || !issue.user || issue.user.login !== 'github-actions[bot]'
                  || typeof issue.title !== 'string' || !issue.title.startsWith(prefix)) continue;
              await github.rest.issues.createComment({
                ...context.repo, issue_number: issue.number,
                body: `مرّت المجموعةُ الكاملة على \`${context.sha.substring(0, 7)}\` — تُغلق تلقائيّاً.`,
              });
              await github.rest.issues.update({
                ...context.repo, issue_number: issue.number, state: 'closed', state_reason: 'completed',
              });
            }

  # ══════════════════════════════════════════════════════
  #  حساسيّةُ المجموعة لليوم (W-20261008-021): الجمعة ثمّ الخميس
  # ══════════════════════════════════════════════════════
  #  اختبارٌ يقرأ «اليوم» بلا تثبيت يفشل بحسب يوم تشغيله (مثالُه حارس VI-13). هنا تُشغَّل المجموعةُ كلُّها (بلا المتصفّح) مرّتين وقد
  #  ثُبّتت `timezone.now` على جمعةٍ ثمّ على خميس بـ`SCHOOLOS_TEST_NOW` (المرفق `_pinned_clock` في tests/conftest.py، وهو
  #  `frozen_clock` القائمة نفسُها)؛ والملفّاتُ المعلَّمة `pin_clock` تبقى على الأربعاء. **تُبلغ ولا تحجب**: هذا السيرُ ليس فحصاً مطلوباً
  #  في حماية main، والفشلُ يفتح قضيّةً (أو يُعلّق على المفتوحة) ويُغلقها النجاحُ التالي. وحدُّها: التثبيتُ على `timezone.now` فقط،
  #  فما يقرأ `date.today()`/`datetime.now()` مباشرةً لا يتبعه (يعدّه tests/test_clock_pin_ratchet.py بـDIRECT_TODAY)؛ وفشلٌ هنا
  #  قد يكون من تجميد الساعة (لا تمضي) لا من اليوم نفسه — يُفرَّق بتشغيل الاختبار منفرداً بالمتغيّر ذاته.
  clock-sensitivity:
    name: pytest — المجموعةُ تحت الجمعة ثمّ الخميس (تُبلغ ولا تحجب)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: shschool.settings.testing
      SECRET_KEY: ci-testing-only-not-for-production-use-a1b2c3d4e5f6
      FERNET_KEY: dGVzdC1mZXJuZXQta2V5LTMyLWJ5dGVzLWZvcmNpLS0=
      EXCEL_PROTECTION_PASSWORD: ci-testing-only

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: تثبيت مكتبات النظام (Cairo + WeasyPrint)
        run: |
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure*  # مستودعاتٌ لا نستعملها تُسقط apt-get update حين يسقط توقيعها
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev \
            libpango1.0-dev \
            libgdk-pixbuf2.0-dev \
            libffi-dev \
            shared-mime-info \
            pkg-config

      - name: تثبيت المتطلبات
        run: pip install -r requirements-dev.txt

      - name: تطبيق Migrations
        run: python manage.py migrate --noinput

      # الخطوتان تشغّلان المجموعةَ نفسَها وكلٌّ منهما تُكمل ولو فشلت الأخرى (`if: always()`)، فيظهر فشلُ اليومين معاً.
      # القائمةُ تُستثنى كما في الخطوة الرئيسيّة أعلاه (اختباراتُ المتصفّح تُشغَّل منفصلةً هناك).
      - name: "الجمعة — المجموعةُ بلا المتصفّح (SCHOOLOS_TEST_NOW=2026-10-09)"
        env:
          SCHOOLOS_TEST_NOW: "2026-10-09T07:10:00+03:00"
        run: |
          python -m pytest \
            --ignore=tests/e2e \
            --ignore=tests/test_a11y_axe_ratchet.py \
            --ignore=tests/test_web_vitals_budget.py \
            --ignore=tests/test_mobile_audit.py \
            --ignore=tests/test_lighthouse_mobile.py \
            --ignore=tests/test_action_cards_fit_narrow_screens.py \
            --ignore=tests/test_page_nav_htmx_process.py \
            -p no:cacheprovider -q

      - name: "الخميس — المجموعةُ بلا المتصفّح (SCHOOLOS_TEST_NOW=2026-10-08)"
        if: always()
        env:
          SCHOOLOS_TEST_NOW: "2026-10-08T07:10:00+03:00"
        run: |
          python -m pytest \
            --ignore=tests/e2e \
            --ignore=tests/test_a11y_axe_ratchet.py \
            --ignore=tests/test_web_vitals_budget.py \
            --ignore=tests/test_mobile_audit.py \
            --ignore=tests/test_lighthouse_mobile.py \
            --ignore=tests/test_action_cards_fit_narrow_screens.py \
            --ignore=tests/test_page_nav_htmx_process.py \
            -p no:cacheprovider -q

      - name: "الفشل: فتحُ قضيّةٍ أو التعليقُ على المفتوحة"
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const prefix = '🕒 CLOCK-SENSITIVITY';
            const detail = [
              `**Commit**: \`${context.sha}\``,
              `**Time**: ${new Date().toISOString()}`,
              `**Run**: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `**Result**: فشلت المجموعةُ حين ثُبّتت الساعةُ على جمعةٍ أو خميس — اختبارٌ حسّاسٌ لليوم لم يُعلَّم \`pin_clock\`. شغّل الاختبارَ منفرداً بـ\`SCHOOLOS_TEST_NOW=2026-10-09T07:10:00+03:00\` (جمعة) أو \`2026-10-08T07:10:00+03:00\` (خميس) وأضِف \`pytestmark = pytest.mark.pin_clock\`. هذا إبلاغٌ لا حجب.`,
            ].join('\n');
            const isOurs = (item) =>
              !item.pull_request &&
              item.user &&
              item.user.login === 'github-actions[bot]' &&
              typeof item.title === 'string' &&
              item.title.startsWith(prefix);
            const open = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'clock-sensitivity',
              sort: 'updated', direction: 'desc', per_page: 100,
            });
            const existing = open.data.filter(isOurs);
            if (existing.length > 0) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: existing[0].number,
                body: `### فشلٌ إضافيّ\n\n${detail}`,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title: `${prefix} — المجموعةُ تفشل تحت الجمعة أو الخميس`,
                body: [`## حساسيّةٌ لليوم — إبلاغ`, ``, detail, ``,
                       `تُحدَّث هذه القضيّةُ عند كلّ فشلٍ لاحق، وتُغلق تلقائيّاً عند أوّل ليلةٍ ناجحة.`].join('\n'),
                labels: ['clock-sensitivity'],
              });
            }

      - name: "النجاح: إغلاقُ قضايا الحساسيّة المفتوحة"
        if: success()
        uses: actions/github-script@v9
        with:
          script: |
            const prefix = '🕒 CLOCK-SENSITIVITY';
            const open = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'clock-sensitivity',
              sort: 'updated', direction: 'desc', per_page: 100,
            });
            for (const issue of open.data) {
              if (issue.pull_request || !issue.user || issue.user.login !== 'github-actions[bot]'
                  || typeof issue.title !== 'string' || !issue.title.startsWith(prefix)) continue;
              await github.rest.issues.createComment({
                ...context.repo, issue_number: issue.number,
                body: `مرّت المجموعةُ تحت الجمعة والخميس على \`${context.sha.substring(0, 7)}\` — تُغلق تلقائيّاً.`,
              });
              await github.rest.issues.update({
                ...context.repo, issue_number: issue.number, state: 'closed', state_reason: 'completed',
              });
            }
