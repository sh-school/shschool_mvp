name: زمن الهجرات

# ══════════════════════════════════════════════
#  W-20261022-021: يطبّق الهجرات على قاعدة تجريبية فارغة ويطبع زمن كل هجرة وإجماليها في ملخص الوظيفة،
#  لنعرف حصةَ الهجرات من زمن النشر (≈24 دقيقة) وأيُّها الأبطأ (مثل core.0082).
#  وظيفةٌ مستقلّةٌ خارج المسار الحرج: لا تدخل needs: في quality-gate.yml ولا تحجب دمجاً ولا نشراً، ولا أسرارَ فيها.
#  تُشغَّل حين يمسّ الطلبُ هجرةً أو يدوياً. الأرقامُ نسبيّةٌ لا مطلقة: قاعدةٌ فارغةٌ على الذاكرة بلا fsync،
#  فزمنُ الإنتاج (بياناتٌ حقيقيّةٌ وقرصٌ) أطولُ؛ المفيدُ ترتيبُ الهجرات وحصصُها.
# ══════════════════════════════════════════════

on:
  pull_request:
    paths:
      - "**/migrations/*.py"
  workflow_dispatch:

concurrency:
  group: migration-timing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  timing:
    name: زمن الهجرات
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DJANGO_SETTINGS_MODULE: shschool.settings.testing
      SECRET_KEY: ci-testing-only-not-for-production-use-a1b2c3d4e5f6
      FERNET_KEY: dGVzdC1mZXJuZXQta2V5LTMyLWJ5dGVzLWZvcmNpLS0=  # pragma: allowlist secret
      EXCEL_PROTECTION_PASSWORD: ci-testing-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # نسخةُ الإنتاج (18) لا 16: الهجراتُ تُقاس على المحرّك نفسه
      - uses: ./.github/actions/native-postgres
        with:
          version: "18"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: تثبيت مكتبات النظام
        run: |
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure*  # مستودعاتٌ لا نستعملها تُسقط apt-get update حين يسقط توقيعها
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev libpango1.0-dev libgdk-pixbuf2.0-dev \
            libffi-dev shared-mime-info pkg-config

      - name: تثبيت المتطلبات
        run: pip install -r requirements.txt

      - name: تطبيق الهجرات بقياس الزمن
        run: |
          python - <<'PY'
          import os
          import time

          import django

          django.setup()
          from django.db import connection
          from django.db.migrations.executor import MigrationExecutor

          timings = []
          started = {}


          def progress(action, migration=None, fake=False):
              if migration is None:
                  return
              key = f"{migration.app_label}.{migration.name}"
              if action == "apply_start":
                  started[key] = time.perf_counter()
              elif action == "apply_success":
                  timings.append((key, time.perf_counter() - started.pop(key)))


          executor = MigrationExecutor(connection, progress_callback=progress)
          targets = executor.loader.graph.leaf_nodes()
          planned = len(executor.migration_plan(targets))
          begin = time.perf_counter()
          executor.migrate(targets)
          total = time.perf_counter() - begin

          timings.sort(key=lambda row: row[1], reverse=True)
          lines = [
              "## زمن الهجرات (قاعدةٌ فارغةٌ على الذاكرة؛ النسبُ لا المطلق)",
              "",
              f"- عدد الهجرات المطبَّقة: {len(timings)} من {planned}",
              f"- الإجمالي: {total:.1f} ثانية",
              "",
              "| # | الهجرة | الثواني | من الإجمالي |",
              "|---|--------|--------:|-----------:|",
          ]
          for rank, (name, seconds) in enumerate(timings[:20], start=1):
              share = 100 * seconds / total if total else 0
              lines.append(f"| {rank} | `{name}` | {seconds:.2f} | {share:.1f}% |")
          text = "\n".join(lines)
          print(text)
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write(text + "\n")
          PY
