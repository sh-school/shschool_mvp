name: Backup Restore Drill — اختبار الاستعادة الأسبوعي

on:
  schedule:
    - cron: "30 2 * * 6"  # السبت 02:30 UTC
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: backup-restore-drill
  cancel-in-progress: false

jobs:
  restore-drill:
    name: استعادة أحدث نسخة والتحقق منها
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: restore_test
          POSTGRES_USER: restore_user
          POSTGRES_PASSWORD: restore_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restore_user -d restore_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: تحديد أحدث تشغيل ناجح للنسخ الاحتياطي
        id: latest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RESPONSE="$(
            curl -fsSL \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/backup.yml/runs?branch=main&status=success&per_page=1"
          )"

          RUN_ID="$(
            printf '%s' "${RESPONSE}" |
            python3 -c 'import json,sys; data=json.load(sys.stdin); runs=data.get("workflow_runs", []); print(runs[0]["id"] if runs else "")'
          )"

          if [ -z "${RUN_ID}" ]; then
            echo "::error::لا يوجد تشغيل ناجح للنسخ الاحتياطي"
            exit 1
          fi

          echo "run_id=${RUN_ID}" >> "${GITHUB_OUTPUT}"
          echo "سيتم اختبار النسخة من التشغيل ${RUN_ID}"

      - name: تنزيل أحدث Artifact للنسخة الاحتياطية
        uses: actions/download-artifact@v4
        with:
          pattern: db-backup-*
          path: backup
          merge-multiple: true
          run-id: ${{ steps.latest.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: تثبيت PostgreSQL 18 وGnuPG
        run: |
          set -euo pipefail
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc |
            sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18 gnupg

      - name: فك التشفير دون طباعة البيانات
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${BACKUP_PASSPHRASE:-}" ]; then
            echo "::error::السر BACKUP_PASSPHRASE غير مضبوط"
            exit 1
          fi

          FILE="$(find backup -type f -name '*.sql.gz.gpg' -print -quit)"
          if [ -z "${FILE}" ] || [ ! -s "${FILE}" ]; then
            echo "::error::لم يتم العثور على ملف نسخة احتياطية صالح"
            exit 1
          fi

          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "${BACKUP_PASSPHRASE}" \
            --decrypt "${FILE}" |
            gunzip > restore.sql

          test -s restore.sql
          echo "تم فك التشفير والتحقق من وجود SQL غير فارغ."

      - name: استعادة النسخة في PostgreSQL مؤقت
        env:
          PGPASSWORD: restore_pass
        run: |
          set -euo pipefail
          /usr/lib/postgresql/18/bin/psql \
            "postgresql://restore_user@localhost:5432/restore_test" \
            --set ON_ERROR_STOP=1 \
            --quiet \
            --file restore.sql \
            >/dev/null

      - name: فحوص سلامة ما بعد الاستعادة
        env:
          PGPASSWORD: restore_pass
        run: |
          set -euo pipefail
          PSQL="/usr/lib/postgresql/18/bin/psql postgresql://restore_user@localhost:5432/restore_test -Atq"

          TABLE_COUNT="$(${PSQL} -c "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE';")"
          MIGRATION_TABLE="$(${PSQL} -c "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public' AND table_name='django_migrations';")"
          MIGRATION_ROWS="$(${PSQL} -c "SELECT COUNT(*) FROM django_migrations;" 2>/dev/null || echo 0)"

          if [ "${TABLE_COUNT}" -le 0 ]; then
            echo "::error::الاستعادة لم تُنتج جداول"
            exit 1
          fi

          if [ "${MIGRATION_TABLE}" -ne 1 ] || [ "${MIGRATION_ROWS}" -le 0 ]; then
            echo "::error::جدول django_migrations مفقود أو فارغ"
            exit 1
          fi

          echo "## نتيجة اختبار الاستعادة" >> "${GITHUB_STEP_SUMMARY}"
          echo "- الجداول المستعادة: ${TABLE_COUNT}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- سجلات migrations: ${MIGRATION_ROWS}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- النتيجة: PASS" >> "${GITHUB_STEP_SUMMARY}"

      - name: حذف الملفات المفكوكة
        if: always()
        run: |
          rm -f restore.sql
          find backup -type f -delete 2>/dev/null || true
