name: تجربة — postgres أصليّ (فرعٌ تجريبيّ فقط)

on:
  push:
    branches: [claude/ci-native-exp]

permissions:
  contents: read

jobs:
  shard-native:
    name: pytest shard 1/5 — postgres أصليّ
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: shschool.settings.testing
      SECRET_KEY: ci-testing-only-not-for-production-use-a1b2c3d4e5f6  # pragma: allowlist secret
      FERNET_KEY: dGVzdC1mZXJuZXQta2V5LTMyLWJ5dGVzLWZvcmNpLS0=  # pragma: allowlist secret
      EXCEL_PROTECTION_PASSWORD: ci-testing-only  # pragma: allowlist secret
      CI_SHARD_COUNT: 5
      CI_SHARD_INDEX: 1
    steps:
      - uses: actions/checkout@v7
      - name: بدء الساعة
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: ./.github/actions/native-postgres
      - name: زمن التجهيز (postgres)
        run: echo "native-postgres ready after $(( $(date +%s) - T0 )) s"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: تثبيت مكتبات النظام
        run: |
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure*
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libcairo2-dev libpango1.0-dev libgdk-pixbuf2.0-dev libffi-dev shared-mime-info pkg-config
      - name: تثبيت المتطلبات
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-django pytest-cov pytest-asyncio factory-boy pytest-xdist==3.8.0
      - name: pytest shard 1
        run: |
          S=$(date +%s)
          python -m pytest -p tests.ci_sharding -n auto --cov=. --cov-report= --cov-fail-under=0
          echo "PYTEST_SECONDS=$(( $(date +%s) - S ))"
