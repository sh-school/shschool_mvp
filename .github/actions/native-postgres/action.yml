name: Postgres 16 أصليّ على الـrunner (بلا Docker)
description: >-
  يشغّل postgres 16 المثبَّت أصلاً على صورة ubuntu-24.04 بمجلّد بياناتٍ على الذاكرة (/dev/shm) وبإعداداتٍ سريعةٍ للاختبار،
  بدل حاويةِ خدمةٍ تُسحب من Docker Hub (يسقطها سقفُ السحب غيرِ الموثَّق: toomanyrequests). المستخدم test_user وكلمتُه كلمةُ الاختبار المعتادة نفسُها
  وقاعدتُه test_db على 127.0.0.1:5432 — كما كانت الحاويةُ، فلا يتغيّر إعدادُ أيّ وظيفة.
inputs:
  redis:
    description: "true ⇒ يُثبَّت redis-server من apt ويُشغَّل على 127.0.0.1:6379 (اختباراتُ طبقة القنوات تحتاج redis حقيقياً)"
    default: "false"
  port:
    description: منفذ الاستماع
    default: "5432"
runs:
  using: composite
  steps:
    - name: تشغيل postgres 16 على الذاكرة
      shell: bash
      env:
        PGPORT_IN: ${{ inputs.port }}
      run: |  # pragma: allowlist secret
        set -euo pipefail
        PGBIN=/usr/lib/postgresql/16/bin
        if [ ! -x "$PGBIN/postgres" ]; then
          echo "::error::postgres 16 غير مثبَّت على صورة الـrunner ($PGBIN) — الصورةُ تغيّرت؟ راجع runner-images"
          exit 1
        fi
        VER="$("$PGBIN/postgres" --version)"
        case "$VER" in
          *" 16."*) echo "الإصدار: $VER" ;;
          *) echo "::error::إصدارٌ غيرُ متوقَّع: $VER (المطلوب 16.x)"; exit 1 ;;
        esac
        # الخدمةُ المدمجةُ إن كانت تعمل (لا تعمل افتراضاً) تحجز المنفذ
        sudo systemctl stop postgresql 2>/dev/null || true
        PGDATA=/dev/shm/pgdata
        rm -rf "$PGDATA"
        install -d -m 700 "$PGDATA"
        PWFILE="$(mktemp)"
        echo "test_pass" > "$PWFILE"  # pragma: allowlist secret
        "$PGBIN/initdb" -D "$PGDATA" -U test_user --auth=md5 --pwfile="$PWFILE" -E UTF8 --locale=C.UTF-8 >/dev/null
        rm -f "$PWFILE"
        # /dev/shm على runner ubuntu-24.04 نحو نصف الذاكرة (≈8 غيغا): يكفي قاعدةَ الاختبار
        # سرعةٌ للاختبار فقط: لا متانة مطلوبة على ذاكرةٍ تُمحى بانتهاء الوظيفة
        cat >> "$PGDATA/postgresql.conf" <<CONF
        listen_addresses = '127.0.0.1'
        port = ${PGPORT_IN}
        unix_socket_directories = '/tmp'
        fsync = off
        synchronous_commit = off
        full_page_writes = off
        max_connections = 200
        shared_buffers = 256MB
        CONF
        "$PGBIN/pg_ctl" -D "$PGDATA" -l /tmp/pg-native.log -w -t 60 start
        PGPASSWORD=test_pass "$PGBIN/createdb" -h 127.0.0.1 -p "$PGPORT_IN" -U test_user test_db  # pragma: allowlist secret
        PGPASSWORD=test_pass "$PGBIN/psql" -h 127.0.0.1 -p "$PGPORT_IN" -U test_user -d test_db -Atc "select version()"  # pragma: allowlist secret
    - name: تشغيل redis من apt (اختياريّ)
      if: inputs.redis == 'true'
      shell: bash
      run: |
        set -euo pipefail
        sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure*  # مستودعاتٌ لا نستعملها تُسقط apt-get update حين يسقط توقيعها
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends redis-server
        sudo systemctl stop redis-server 2>/dev/null || true
        redis-server --port 6379 --bind 127.0.0.1 --save "" --appendonly no --daemonize yes
        for _ in $(seq 1 20); do redis-cli -h 127.0.0.1 ping 2>/dev/null | grep -q PONG && break; sleep 0.5; done
        redis-cli -h 127.0.0.1 ping
