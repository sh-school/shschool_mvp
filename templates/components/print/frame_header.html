{% load static school_logo %}{% comment %}<style>{% include "components/print/frame_css.html" %}</style>{% endcomment %}{% comment %}
أنماطُ هذا المكوّن في `frame_css.html` يحقنها `{% print_frame_css %}` في رأس الوثيقة (سطرُ `<style>` أعلاه تصريحٌ لحارس الهويّة: الأصنافُ معرَّفةٌ هناك)؛
الترويسةُ الكاملة للإطار المطبوع المركزيّ (`{% print_frame_header %}`): وزارةٌ (إن ظهرت) فمدرسةٌ يسبق اسمَها شعارُ «ش» في سطرها نفسِه (D-404م) فعنوانٌ فسطرُ السنة، وسطرُ الرؤية حيث ينقلها الإطارُ إليها.
الشعارُ `data:` URI مضمَّنٌ في سطر المدرسة (لا يزيد ارتفاعَ الترويسة: ضلعُه أقلُّ من ارتفاع سطرها)؛ وحجمُه في `frame_css.html`.
{% endcomment %}<div id="print-header">
  {% if ministry %}<div class="pf-ministry">{{ ministry }}</div>{% endif %}
  <div class="pf-school">{% school_logo "inline" pdf=True %}{{ school.name }}</div>
  <div class="pf-title">{{ title }}</div>
  {% if subtitle %}<div class="pf-sub">{{ subtitle }}</div>{% endif %}
  {% if vision %}<div class="pf-vision">{{ vision }}</div>{% endif %}
</div>
