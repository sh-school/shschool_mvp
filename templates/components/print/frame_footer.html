أنماطُه في `frame_css.html` يحقنها `{% print_frame_css %}` (سطرُ `<style>` أعلاه تصريحٌ لحارس الهويّة).
صفُّ التذييل الواحد (`{% print_frame_footer %}`): العناصرُ بترتيب الأولويّة (المدرسةُ ← ص/ص ← تاريخُ الطباعة ← ما وَسِعه الصفّ)، يفصل بينها « · ».
ص/ص عدّادان في CSS (`counter(page) / counter(pages)`) فيُحسبان لكلّ صفحة. لا صفَّ ثانياً ولا قصّ: ما لا يسع يسقط بالأولويّة (`core.print_frame.footer_plan`).
