{% load icons %}{% if count %}{% if detached %}<button type="submit" form="approve-all-form" class="btn-primary btn-sm per-approve-all" aria-label="اعتماد كلّ الإدخالات المعلّقة وعددها {{ count }} دفعةً واحدة" title="يعتمد إدخالاتِ المعلّمين فقط (كلُّ الشعب والحصص) ولا يثبّت الحصّةَ ولا يرفض شيئاً">{% icon "confirm" %} اعتمادُ الكلّ ({{ count }})</button>{% else %}<form method="post" action="{% url 'attendance_approve_all' %}" class="per-approve-all" data-confirm="اعتماد {{ count }} إدخالاً دفعةً واحدة (كلُّ الشعب والحصص)؟ يُسجَّل كلُّ قرارٍ باسمك والرفضُ يبقى بنداً بنداً.">
  {% csrf_token %}<input type="hidden" name="next" value="{{ next }}">
  <button type="submit" class="btn-primary btn-sm" aria-label="اعتماد كلّ الإدخالات المعلّقة وعددها {{ count }} دفعةً واحدة" title="يعتمد إدخالاتِ المعلّمين فقط (كلُّ الشعب والحصص) — الرفضُ يبقى بنداً بنداً">{% icon "confirm" %} اعتمادُ الكلّ ({{ count }})</button>
</form>{% endif %}{% endif %}
