<tr id="row-{{ student.id }}" data-text="{{ student.full_name }}"{% if grade_obj.is_absent or grade_obj.grade is not None %} class="{% if grade_obj.is_absent %}is-danger{% else %}is-done{% endif %}"{% endif %}>

  <td>{{ student.full_name }}</td>

  <form hx-post="{% url 'save_single_grade' assessment.id %}"
        hx-target="#row-{{ student.id }}"
        hx-swap="outerHTML"
        hx-include="this"
        class="contents">
    {% csrf_token %}
    <input type="hidden" name="student_id" value="{{ student.id }}">

    <td class="num">
      <input type="number"
             name="grade"
             value="{% if grade_obj and not grade_obj.is_absent and grade_obj.grade is not None %}{{ grade_obj.grade }}{% endif %}"
             min="0" max="{{ assessment.max_grade }}" step="0.5"
             class="form-control form-control-sm asm-grade-input"
             id="grade_inp_{{ student.id }}"
             aria-label="درجة {{ student.full_name }}"
             {% if grade_obj and grade_obj.is_absent %}disabled{% endif %}>
    </td>

    <td class="num">
      <input type="checkbox" name="is_absent" value="1"
             {% if grade_obj and grade_obj.is_absent %}checked{% endif %}
             class="asm-check is-absent" aria-label="غائب"
             data-disables="#grade_inp_{{ student.id }}">
    </td>

    <td class="num">
      <input type="checkbox" name="is_excused" value="1"
             {% if grade_obj and grade_obj.is_excused %}checked{% endif %}
             class="asm-check is-excused" aria-label="معذور">
    </td>

    <td>
      <input type="text" name="notes"
             value="{% if grade_obj %}{{ grade_obj.notes }}{% endif %}"
             placeholder="ملاحظة..." aria-label="ملاحظة"
             class="form-control form-control-sm">
    </td>

    <td class="num">
      <button type="submit" class="btn-secondary btn-sm">حفظ</button>
    </td>
  </form>

</tr>
