{% load icons %}
<div class="form-note clinic-done">
  {% icon "status_success" %}
  <div>
    <p class="clinic-done__title">تم تسجيل الزيارة بنجاح</p>
    <p class="clinic-done__sub">
      {{ visit.student.full_name }} — {{ visit.visit_date|date:"d/m/Y H:i" }}
      {% if visit.is_sent_home %} | <strong>أُرسل للمنزل</strong>{% endif %}
    </p>
    <a href="{% url 'clinic:health_record' visit.student.id %}" class="clinic-done__link">
      عرض السجل الصحي الكامل →
    </a>
  </div>
</div>
