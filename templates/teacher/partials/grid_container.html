{% load ui %}
<div id="grid-container" class="att-grid">
  {% for item in students_data %}
  {% include "teacher/partials/grid_cell.html" with student=item.student attendance=item.attendance status=item.status tone=item.tone session=session only %}
  {% empty %}
  {% empty_state "لا طلابَ في هذه الشعبة" icon="students" %}
  {% endfor %}
</div>
<script nonce="{{ request.csp_nonce }}">document.body.dispatchEvent(new Event('refresh'));</script>
