[pytest]
DJANGO_SETTINGS_MODULE = shschool.settings.testing
# النمط السابق كان `tests/*.py tests/**/*.py` — فلم يجمع `student_affairs/tests.py`
# قطّ (لا مجلّد `tests/` فيه). خمسةُ اختباراتٍ أمنية على تقديم الملفّات لم
# يُشغّلها أحد، منها اثنان ميّتان بـ`TypeError` منذ تغيّر نموذج المستخدم.
python_files = test_*.py tests.py
addopts = -v --tb=short --strict-markers
markers =
    slow: marks tests as slow
    integration: marks tests as integration tests
    e2e: end-to-end browser tests (require playwright)
